[package]
name = "synveda-gateway"
description = "HTTP/gRPC gateway — the only binary that speaks to the outside"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
synveda-identity = { workspace = true }
synveda-policy = { workspace = true }
synveda-retrieval = { workspace = true }
synveda-store = { workspace = true }
synveda-types = { workspace = true }

axum = { workspace = true }
metrics = { workspace = true }
serde = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "net", "sync"] }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
http-body-util = { workspace = true }
# The AUTH-1 AC test's mock IdP signs RS256 tokens and checks PKCE itself.
jsonwebtoken = { workspace = true }
# Drives the mock IdP's authorize redirect the way a browser would.
reqwest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tower = { workspace = true }
url = { workspace = true }
