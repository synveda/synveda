[package]
name = "synveda-ingest"
description = "Extraction, redaction, dedup, and summarisation (Temporal activities)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
synveda-audit = { workspace = true }
synveda-policy = { workspace = true }
synveda-store = { workspace = true }
synveda-types = { workspace = true }
# The derived-channel commit that lands with every extracted record
# (FLOW-2, ADR-0031 decision 13; ADR-0022's recorded forward obligation).
synveda-vedaflow = { workspace = true }

# The deterministic embedder's hash (MEM-4, ADR-0023) — the same
# primitive the audit chain already uses (AUD-1).
blake3 = { workspace = true }
chrono = { workspace = true }
metrics = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The extractor HTTP tests stand up mock Claude/vLLM servers in-process,
# the MockIdp discipline (never a network dependency in tests).
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
# Fixed record ids in the dedup judge's tests: a verdict that names the
# wrong neighbour must fail on the id, not on whichever uuid was minted.
uuid = { workspace = true }
