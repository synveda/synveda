[package]
name = "synveda-store"
description = "Tenant-bound Postgres and pgvector storage for the context platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
synveda-types = { workspace = true }
# The key plane (TEN-4, ADR-0064): this crate stores wrapped keys and sealed
# envelopes and never a plaintext secret, so it needs the seam that unwraps
# and the type that seals.
synveda-crypto = { workspace = true }

blake3 = { workspace = true }
chrono = { workspace = true }
metrics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
