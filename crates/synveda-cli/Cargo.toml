[package]
name = "synveda-cli"
description = "Admin/dev CLI (synveda init, synveda policy apply, synveda proposal review, ...)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "synveda"
path = "src/main.rs"

[dependencies]
# Store + identity for the dev-bootstrap commands only (db migrate, tenant
# create, token issue — ADR-0008); everything a running gateway can serve
# goes through its API instead. Policy for the apply-time compile check
# (AUTHZ-1, ADR-0012): a pack the reloader would reject never reaches the
# store. Audit because the break-glass audits itself (AUD-1, ADR-0019
# decision 7) and `synveda audit verify` is the operator's chain check.
synveda-audit = { workspace = true }
synveda-identity = { workspace = true }
synveda-policy = { workspace = true }
synveda-store = { workspace = true }
synveda-types = { workspace = true }
# `synveda skill install` recomputes what it wrote against the address the
# published commit named (SKIL-1, ADR-0051 decision 12).
synveda-vedaflow = { workspace = true }

base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
# `synveda login`'s loopback CSRF state (ADPT-1, ADR-0027 decision 5) —
# the same CSPRNG the login flow itself uses for state/nonce/verifier.
getrandom = { workspace = true }
# The CLI is a gateway client for `login`, `auth token`, and everything
# else a running gateway serves (ADR-0027 decision 4).
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
# `net`/`io-util` for the loopback listener `synveda login` binds; there is
# no daemon and no long-lived server, only one request from one browser.
tokio = { workspace = true, features = ["net", "io-util"] }
url = { workspace = true }
