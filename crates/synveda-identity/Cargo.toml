[package]
name = "synveda-identity"
description = "OIDC, SCIM, directory sync, and hierarchy provisioning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
synveda-types = { workspace = true }

async-trait = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
jsonwebtoken = { workspace = true }
metrics = { workspace = true }
reqwest = { workspace = true }
rsa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# The connector tests stand up mock Graph and Okta servers in-process — the
# MockIdp discipline this crate already follows, and the extractor/embedder
# HTTP suites' shape: never a network dependency in a test.
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros"] }
