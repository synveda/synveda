[package]
name = "synveda-eval"
description = "The eval harness (EVAL-1): scenario suites against a live stack, five axes, a committed baseline as the gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "synveda-eval"
path = "src/main.rs"

# No Synveda crates, deliberately, and `scripts/check-crate-deps.mjs`
# holds it to that (ADR-0028 decision 1). An eval that can link the store
# can seed and read around the PDP, and would then report quality the
# product cannot deliver. This one speaks `/v1` and nothing else, which is
# also what lets it be pointed at a deployment whose source it does not
# have.
[dependencies]
# The LongMemEval corpus is fetched rather than committed — it is far too
# large for a git history — so a published score has no bytes in the repo
# to point at. Every run digests the file it read instead (EVAL-3,
# ADR-0061 decision 11), in the same hash the product watermarks blocks
# with.
blake3 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiktoken-rs = "0.12.0"
tokio = { workspace = true }

# Test-only. The judge's HTTP contract runs against an in-process mock
# server — the same discipline `crates/synveda-ingest/tests/extractor_http
# .rs` follows, and for the same reason: a test that reached the real API
# would be a test that failed when someone else's network did. Nothing
# here is a runtime dependency, so the empty set above is unchanged.
[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
