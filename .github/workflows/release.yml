name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional assertion of the workspace version. Publishes nothing."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check release source
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pick.outputs.version }}
      publish: ${{ steps.pick.outputs.publish }}
      dockerhub_namespace: ${{ steps.pick.outputs.dockerhub_namespace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Resolve the version, and refuse a tag the crates disagree with
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          TRIGGER_SHA: ${{ github.sha }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA" || {
            echo "checkout does not match the workflow trigger SHA" >&2
            exit 1
          }
          if [ "$EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="${INPUT_VERSION:-$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)}"
            publish=false
          fi
          sh scripts/release-version.sh "$version"
          crate="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [ "$version" != "$crate" ]; then
            echo "tag v$version does not match the workspace version $crate." >&2
            echo "The binaries and reference artifact must use one workspace version." >&2
            exit 1
          fi
          namespace=$(node scripts/release-registries.mjs namespace "$publish")
          echo "dockerhub_namespace=$namespace" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "building $version (publish=$publish)"
      - name: Require full CI for the exact tagged commit
        if: steps.pick.outputs.publish == 'true'
        run: node scripts/require-release-ci.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cli:
    name: Build and Test native CLI
    needs: version
    uses: ./.github/workflows/cli.yml
    with:
      version: ${{ needs.version.outputs.version }}
      servers: true

  docker:
    name: Build and Test Docker and Helm candidates
    needs: version
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.version.outputs.version }}
      full_compose: true

  bundles:
    name: Build release bundles
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.3
      - run: corepack enable
      - name: The console bundle
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          pnpm install --frozen-lockfile --filter @synveda/console...
          pnpm --filter @synveda/console build
          test -f console/dist/index.html
          stage="$(mktemp -d)"
          mkdir -p "$stage/console"
          cp -R console/dist/. "$stage/console/"
          test -f "$stage/console/index.html"
          tar -czf "synveda-console-$version.tar.gz" -C "$stage" console
          tar -tzf "synveda-console-$version.tar.gz" | sed -n '1,3p'
      - name: The Helm chart
        run: sh scripts/package-chart.sh "${{ needs.version.outputs.version }}" .
      - name: The Claude Code marketplace and Codex/Copilot hook runtimes
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter @synveda/codex-adapter... --filter @synveda/copilot-cli-adapter...
          pnpm --filter @synveda/codex-adapter... --filter @synveda/copilot-cli-adapter... build
          make plugin-package-check
          scripts/package-plugin.sh "${{ needs.version.outputs.version }}" .
      - name: The plugin manifest is one Claude Code accepts
        run: |
          set -uo pipefail
          if command -v claude >/dev/null 2>&1; then
            mkdir -p /tmp/validate && tar -xzf "synveda-plugin-${{ needs.version.outputs.version }}.tar.gz" -C /tmp/validate
            claude plugin validate /tmp/validate/plugin || echo "::warning::claude plugin validate reported problems"
            claude plugin validate /tmp/validate/plugin/synveda || echo "::warning::claude plugin validate reported problems"
          else
            echo "::notice::claude CLI not present on this runner — manifest not validated here"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundles
          path: |
            synveda-*.tar.gz
            synveda-*.tgz
          if-no-files-found: error


  images:
    name: Publish Docker candidates
    needs: [version, cli, bundles, docker]
    environment: ${{ needs.version.outputs.publish == 'true' && 'release' || 'release-dry-run' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install OCI copy tool
        if: needs.version.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: needs.version.outputs.publish == 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.version.outputs.publish == 'true'
        with:
          name: docker-candidate-${{ matrix.arch }}
          path: candidate
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: needs.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: needs.version.outputs.publish == 'true'
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy qualified images without rebuilding or replacing tags
        if: needs.version.outputs.publish == 'true'
        run: REGISTRY_AUTH_FILE="${DOCKER_CONFIG:-$HOME/.docker}/config.json" node scripts/publish-images.mjs candidate "$VERSION" "$GITHUB_SHA" "$ARCH"
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          DOCKERHUB_NAMESPACE: ${{ needs.version.outputs.dockerhub_namespace }}

  assemble:
    name: Assemble release assets
    needs: [version, cli, bundles, images]
    environment: ${{ needs.version.outputs.publish == 'true' && 'release' || 'release-dry-run' }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          pattern: "{binaries-*,bundles}"
          merge-multiple: true
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: needs.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: needs.version.outputs.publish == 'true'
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Join and inspect both registry destinations
        env:
          PUBLISH: ${{ needs.version.outputs.publish }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.version }}
          DOCKERHUB_NAMESPACE: ${{ needs.version.outputs.dockerhub_namespace }}
        run: |
          node scripts/release-registries.mjs assemble "$VERSION" "$SOURCE_SHA" "$PUBLISH" \
            "assets/synveda-registry-images-$VERSION.json"
      - name: Package the digest-bound Docker reference
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SYNVEDA_PACKAGE_CONSUMER_CANDIDATE: "1"
        run: |
          node scripts/release-registries.mjs package \
            "assets/synveda-registry-images-$VERSION.json" assets
      - name: Verify the complete assembled inventory and checksums
        run: node scripts/check-release-assets.mjs assets "$VERSION" "$GITHUB_SHA" "$PUBLISH" assembled
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PUBLISH: ${{ needs.version.outputs.publish }}
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.3
      - name: Publish and pull the OCI chart
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "assets/synveda-$version.tgz" oci://ghcr.io/synveda/charts
          mkdir pulled-chart
          helm pull oci://ghcr.io/synveda/charts/synveda --version "$version" --destination pulled-chart
          cmp "assets/synveda-$version.tgz" "pulled-chart/synveda-$version.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            assets/SHA256SUMS
            assets/synveda-*.tar.gz
            assets/synveda-client-*.zip
            assets/synveda-*.tgz
            assets/synveda-*.yaml
            assets/synveda-registry-images-*.json
            assets/synveda-client-report-*.json
          if-no-files-found: error


  verify-images:
    name: Test published Docker and Helm artifacts
    needs: [version, assemble]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Use an empty Docker credential directory
        run: |
          directory="$(mktemp -d "$RUNNER_TEMP/synveda-anonymous-docker.XXXXXX")"
          echo "DOCKER_CONFIG=$directory" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: needs.version.outputs.publish == 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: assets
      - name: Verify release archive checksums
        working-directory: assets
        run: sha256sum --check SHA256SUMS
      - name: Pull and execute the released images anonymously
        if: needs.version.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          tar -xzf "assets/synveda-reference-$VERSION.tar.gz" -C "$RUNNER_TEMP"
          node scripts/verify-release-images.mjs \
            "$RUNNER_TEMP/synveda-reference-$VERSION" "$PLATFORM" \
            "$VERSION" "$SOURCE_SHA" "release-images-${{ matrix.arch }}.json" \
            "assets/synveda-registry-images-$VERSION.json"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        if: needs.version.outputs.publish == 'true'
        with:
          version: v4.2.3
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        if: needs.version.outputs.publish == 'true'
        with:
          install_only: true
          version: v0.32.0
          kubectl_version: v1.36.1
      - name: Qualify the exact Docker and chart artifacts
        if: needs.version.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/qualify-release.mjs \
            "$RUNNER_TEMP/synveda-reference-$VERSION" "release-docker-${{ matrix.arch }}.json"
          node scripts/qualify-release.mjs --consumer-candidate \
            "$RUNNER_TEMP/synveda-reference-$VERSION" "release-consumer-${{ matrix.arch }}.json"
          node scripts/qualify-kubernetes-release.mjs \
            "$RUNNER_TEMP/synveda-reference-$VERSION" "assets/synveda-$VERSION.tgz" \
            "release-kubernetes-${{ matrix.arch }}.json"
          export HELM_REGISTRY_CONFIG="$RUNNER_TEMP/anonymous-helm.json"
          mkdir anonymous-chart
          helm pull oci://ghcr.io/synveda/charts/synveda --version "$VERSION" --destination anonymous-chart
          cmp "assets/synveda-$VERSION.tgz" "anonymous-chart/synveda-$VERSION.tgz"
      - name: Explain the dry-run boundary
        if: needs.version.outputs.publish != 'true'
        run: |
          echo "Dry run: native OCI candidates, Compose and Helm were tested by Docker. The synthetic public inventory is not installable; no public registry verification or publication ran."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.version.outputs.publish == 'true'
        with:
          name: release-verification-${{ matrix.arch }}
          path: |
            release-images-${{ matrix.arch }}.json
            release-docker-${{ matrix.arch }}.json
            release-consumer-${{ matrix.arch }}.json
            release-kubernetes-${{ matrix.arch }}.json
          if-no-files-found: error

  publish:
    name: Publish verified release
    if: needs.version.outputs.publish == 'true'
    needs: [version, assemble, verify-images]
    environment: ${{ needs.version.outputs.publish == 'true' && 'release' || 'release-dry-run' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.version.outputs.publish == 'true'
        with:
          pattern: release-verification-*
          path: assets
          merge-multiple: true
      - name: Verify all native reports and the final asset set
        run: node scripts/check-release-assets.mjs assets "$VERSION" "$GITHUB_SHA" true qualified
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - name: Authenticate the final release inventory
        id: attest
        if: needs.version.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: assets/SHA256SUMS
      - name: Verify and retain the publisher attestation
        if: needs.version.outputs.publish == 'true'
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp "$ATTESTATION_BUNDLE" assets/SHA256SUMS.sigstore.json
          gh attestation verify assets/SHA256SUMS --bundle assets/SHA256SUMS.sigstore.json \
            --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$SOURCE_SHA" --deny-self-hosted-runners
      - name: Retain the signed inventory for upload recovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-assets
          path: |
            assets/SHA256SUMS
            assets/SHA256SUMS.sigstore.json
            assets/synveda-*.tar.gz
            assets/synveda-client-*.zip
            assets/synveda-*.tgz
            assets/synveda-*.yaml
            assets/synveda-registry-images-*.json
            assets/synveda-client-report-*.json
            assets/release-*.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish after draft uploads are complete
        run: node scripts/publish-release.mjs assets "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DOCKERHUB_NAMESPACE: ${{ needs.version.outputs.dockerhub_namespace }}
