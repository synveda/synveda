# Release (OPS-8, ADR-0065) — turns a tag into something somebody else can
# install. `make check-release-parity` validates its version, chart and image
# plan without a daemon. Tagged releases additionally pull the final images
# anonymously and run native executable checks before announcing the release.
#
# On `v*`:
#
#   binaries   synveda + synveda-gateway + synveda-worker for darwin-arm64 and
#              linux-x86_64,
#              built SQLX_OFFLINE=true against the committed query cache
#   console    the CNSL-1 bundle carried by product artifacts
#   reference  canonical Compose runtime files bound to published image digests
#   chart      version-matched Helm chart archive
#   images     ghcr.io/synveda/{product,postgres,cnpg-postgres,keycloak,
#              proxy}, multi-architecture publication targets
#   fixture    ghcr.io/synveda/browser-acceptance for release acceptance only
#   SHA256SUMS over every asset above
#
# Two targets rather than four: ADR-0065 decision 7. Adding one is a matrix
# row here plus a case in scripts/install.sh, and the installer refuses an
# unsupported platform by name so a missing row is never a silent wrong
# download.
name: Release

on:
  push:
    tags: ["v*"]
  # A dry run against a branch: builds and packages everything, publishes
  # nothing. This is how the workflow gets tested without minting a tag,
  # since nothing in `make ci` exercises it.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v). Publishes nothing."
        required: true
        default: "0.0.0-dev"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pick.outputs.version }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve the version, and refuse a tag the crates disagree with
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA" || {
            echo "checkout does not match the workflow trigger SHA" >&2
            exit 1
          }
          if [ "$EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="$INPUT_VERSION"
            publish=false
          fi
          sh scripts/release-version.sh "$version"
          # Binaries and deployment artifacts are one versioned release
          # contract. A tag that disagrees with the workspace would make the
          # artifact set internally inconsistent, so it fails here instead.
          # awk rather than `sed | head`, for the reason the console step
          # above now carries: under `pipefail`, a reader that closes early
          # fails the writer. This one survived only because its output fits
          # the pipe buffer, which is luck rather than design.
          crate="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [ "$publish" = "true" ] && [ "$version" != "$crate" ]; then
            echo "tag v$version does not match the workspace version $crate." >&2
            echo "The binaries and reference artifact must use one workspace version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "building $version (publish=$publish)"

  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runs-on: macos-14        # Apple Silicon
            rust-target: aarch64-apple-darwin
          - target: linux-x86_64
            runs-on: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: |
          cargo build --release --locked \
            --target ${{ matrix.rust-target }} \
            -p synveda-cli -p synveda-gateway
      - name: Package
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          out="target/${{ matrix.rust-target }}/release"
          stage="$(mktemp -d)"
          cp "$out/synveda" "$out/synveda-gateway" "$out/synveda-worker" "$stage/"
          # Stripped: these are release binaries a tester downloads, and the
          # debug info is tens of megabytes of a download nobody symbolises.
          strip "$stage/synveda" "$stage/synveda-gateway" "$stage/synveda-worker" || true
          tar -czf "synveda-$version-${{ matrix.target }}.tar.gz" -C "$stage" \
            synveda synveda-gateway synveda-worker
          ls -lh "synveda-$version-${{ matrix.target }}.tar.gz"
      - name: It runs, and it is the version it claims
        run: |
          set -euo pipefail
          out="target/${{ matrix.rust-target }}/release"
          # Both targets are native to their runner, so a smoke test is free
          # and catches a binary that will not dynamically link.
          "$out/synveda" --version
          test -x "$out/synveda-worker"
          # Only on a tag. A `workflow_dispatch` dry run names its own
          # version and the binary still reports CARGO_PKG_VERSION, so
          # asserting agreement there would fail every dry run — and the
          # tag/crate agreement is the `version` job's, which refuses the
          # mismatch before anything is built.
          if [ "${{ needs.version.outputs.publish }}" = "true" ]; then
            "$out/synveda" --version | grep -q "${{ needs.version.outputs.version }}" \
              || { echo "the binary does not report ${{ needs.version.outputs.version }}" >&2; exit 1; }
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.target }}
          path: synveda-*.tar.gz
          if-no-files-found: error

  bundles:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.3
      - run: corepack enable
      - name: The console bundle
        # CNSL-1's static assets. The image has carried them since ADR-0056;
        # this copy is also packaged for direct-binary evaluation.
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          pnpm install --frozen-lockfile --filter @synveda/console...
          pnpm --filter @synveda/console build
          test -f console/dist/index.html
          # Staged rather than renamed inside the archive: install.sh copies
          # a top-level `console/` out of it, and one layout that is obvious
          # beats two that depend on which tar built it.
          stage="$(mktemp -d)"
          mkdir -p "$stage/console"
          cp -R console/dist/. "$stage/console/"
          test -f "$stage/console/index.html"
          tar -czf "synveda-console-$version.tar.gz" -C "$stage" console
          # `sed -n '1,3p'` rather than `head -n 3`: head closes the pipe
          # after three lines, tar takes EPIPE, and `pipefail` promotes that
          # to a failed job — which is exactly how this step died on its
          # first dispatch, after building the bundle perfectly. sed reads
          # to EOF, so tar always finishes writing.
          tar -tzf "synveda-console-$version.tar.gz" | sed -n '1,3p'
      - name: The Helm chart
        run: sh scripts/package-chart.sh "${{ needs.version.outputs.version }}" .
      - name: The Claude Code marketplace and Codex/Copilot hook runtimes
        # A marketplace, not a plugin directory — that is the unit Claude
        # Code installs, and dropping a plugin under `~/.claude/plugins/`
        # (which is what this repository's docs said to do) installs
        # nothing. `synveda plugin install` adds this and asks Claude Code's
        # own CLI to install from it.
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter @synveda/codex-adapter... --filter @synveda/copilot-cli-adapter...
          pnpm --filter @synveda/codex-adapter... --filter @synveda/copilot-cli-adapter... build
          make plugin-package-check
          scripts/package-plugin.sh "${{ needs.version.outputs.version }}" .
      - name: The plugin manifest is one Claude Code accepts
        # `claude plugin validate` is the vendor's own check. It is advisory
        # here rather than required: the runner may not have the CLI, and a
        # release must not fail because a linter was unavailable. What it
        # cannot catch is a manifest that validates and still fails to load
        # — which is exactly what shipped — so `package-plugin.sh` asserts
        # the two keys responsible, and the OPS-8 demo installs it for real.
        run: |
          set -uo pipefail
          if command -v claude >/dev/null 2>&1; then
            mkdir -p /tmp/validate && tar -xzf "synveda-plugin-${{ needs.version.outputs.version }}.tar.gz" -C /tmp/validate
            claude plugin validate /tmp/validate/plugin || echo "::warning::claude plugin validate reported problems"
            claude plugin validate /tmp/validate/plugin/synveda || echo "::warning::claude plugin validate reported problems"
          else
            echo "::notice::claude CLI not present on this runner — manifest not validated here"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundles
          path: |
            synveda-*.tar.gz
            synveda-*.tgz
          if-no-files-found: error

  # One architecture per **native** runner, never QEMU.
  #
  # Native amd64 and arm64 runners keep release builds inside the workflow
  # budget and avoid forcing Apple Silicon reference installs through QEMU.
  images:
    needs: version
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    env:
      # `docker/build-push-action` uploads a `.dockerbuild` build record as a
      # workflow artifact per build — twelve of them across this matrix. They
      # are for the Actions build summary UI and nothing here reads them,
      # but `publish` downloads artifacts and one of these is what failed
      # its first run. Not produced at all is better than filtered later.
      DOCKER_BUILD_SUMMARY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: needs.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Per-architecture tags. A dry run builds and pushes nothing; a tagged
      # release joins them into the digest identities in environment.json.
      # Cache scopes are per-arch because two architectures sharing one scope
      # evict each other on every run.
      - name: The product image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/compose/product/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          push: ${{ needs.version.outputs.publish == 'true' }}
          tags: ghcr.io/synveda/product:${{ needs.version.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=product-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=product-${{ matrix.arch }}
      - name: Postgres
        # Same Dockerfile the dev compose builds, published under a name that
        # is not "dev-" because this one is what a customer installs.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/compose/postgres/Dockerfile
          target: reference
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          push: ${{ needs.version.outputs.publish == 'true' }}
          tags: ghcr.io/synveda/postgres:${{ needs.version.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=postgres-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=postgres-${{ matrix.arch }}
      - name: CloudNativePG PostgreSQL
        # The chart data plane is a distinct image contract: CloudNativePG's
        # base plus the same pgvector/bootstrap surface. It shares the release
        # version, never the single-host image implementation.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/helm/postgres/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          push: ${{ needs.version.outputs.publish == 'true' }}
          tags: ghcr.io/synveda/cnpg-postgres:17.11-synveda-${{ needs.version.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=cnpg-postgres-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cnpg-postgres-${{ matrix.arch }}
      - name: Bundled Keycloak
        # The canonical bundled provider is the optimized production-mode
        # image, including only the reviewed Synveda projection/convergence
        # helpers. Provider identity remains generic OIDC at the product seam.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/compose/keycloak/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          push: ${{ needs.version.outputs.publish == 'true' }}
          tags: ghcr.io/synveda/keycloak:${{ needs.version.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=keycloak-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=keycloak-${{ matrix.arch }}
      - name: Reference proxy
        # This is not a cosmetic wrapper around Caddy: its Dockerfile removes
        # the upstream file capability before switching to the reference UID.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/compose/proxy/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          push: ${{ needs.version.outputs.publish == 'true' }}
          tags: ghcr.io/synveda/proxy:${{ needs.version.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=proxy-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=proxy-${{ matrix.arch }}
      - name: Browser acceptance fixture
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/compose/product/Dockerfile
          target: browser-acceptance
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          push: ${{ needs.version.outputs.publish == 'true' }}
          tags: ghcr.io/synveda/browser-acceptance:${{ needs.version.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=product-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=product-${{ matrix.arch }}

  assemble:
    needs: [version, binaries, bundles, images]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          # Named rather than "everything this run produced". Belt to the
          # `DOCKER_BUILD_SUMMARY: false` braces above: a future action that
          # uploads an artifact of its own must not land in the directory
          # this job checksums and publishes.
          pattern: "{binaries-*,bundles}"
          merge-multiple: true
      # Join only tagged builds. Dry runs still assemble and checksum archives
      # with explicitly synthetic digests; registry verification needs a tag.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: needs.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the per-architecture image tags
        if: needs.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          for image in product postgres keycloak proxy browser-acceptance; do
            docker buildx imagetools create \
              --tag "ghcr.io/synveda/$image:$version" \
              "ghcr.io/synveda/$image:$version-amd64" \
              "ghcr.io/synveda/$image:$version-arm64"
            docker buildx imagetools inspect "ghcr.io/synveda/$image:$version"
          done
          cnpg_tag="17.11-synveda-$version"
          docker buildx imagetools create \
            --tag "ghcr.io/synveda/cnpg-postgres:$cnpg_tag" \
            "ghcr.io/synveda/cnpg-postgres:$cnpg_tag-amd64" \
            "ghcr.io/synveda/cnpg-postgres:$cnpg_tag-arm64"
          docker buildx imagetools inspect "ghcr.io/synveda/cnpg-postgres:$cnpg_tag"
      - name: Package the digest-bound Docker reference
        env:
          PUBLISH: ${{ needs.version.outputs.publish }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          if [ "$PUBLISH" = true ]; then
            digest_of() {
              image=$1
              output=$2
              if ! docker buildx imagetools inspect --raw "$image" > "$output"; then
                rm -f "$output"
                return 1
              fi
              if [ ! -s "$output" ]; then
                rm -f "$output"
                return 1
              fi
              digest=$(sha256sum "$output" | awk '{print $1}') || return 1
              printf 'sha256:%s\n' "$digest"
            }
            product_digest=$(digest_of "ghcr.io/synveda/product:$version" product-manifest.json)
            postgres_digest=$(digest_of "ghcr.io/synveda/postgres:$version" postgres-manifest.json)
            keycloak_digest=$(digest_of "ghcr.io/synveda/keycloak:$version" keycloak-manifest.json)
            proxy_digest=$(digest_of "ghcr.io/synveda/proxy:$version" proxy-manifest.json)
            browser_digest=$(digest_of "ghcr.io/synveda/browser-acceptance:$version" browser-manifest.json)
            helm_postgres_digest=$(digest_of \
              "ghcr.io/synveda/cnpg-postgres:17.11-synveda-$version" \
              helm-postgres-manifest.json)
          else
            # workflow_dispatch publishes nothing. Synthetic, well-formed
            # identities exercise packaging but are never uploaded as a release.
            product_digest=sha256:1111111111111111111111111111111111111111111111111111111111111111
            postgres_digest=sha256:2222222222222222222222222222222222222222222222222222222222222222
            keycloak_digest=sha256:3333333333333333333333333333333333333333333333333333333333333333
            proxy_digest=sha256:4444444444444444444444444444444444444444444444444444444444444444
            browser_digest=sha256:5555555555555555555555555555555555555555555555555555555555555555
            helm_postgres_digest=sha256:6666666666666666666666666666666666666666666666666666666666666666
          fi
          scripts/package-release.sh "$version" assets "$SOURCE_SHA" \
            "$product_digest" "$postgres_digest" "$keycloak_digest" \
            "$proxy_digest" "$browser_digest" "$helm_postgres_digest"
      - name: Every release asset is present
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          for asset in \
            "synveda-$version-darwin-arm64.tar.gz" \
            "synveda-$version-linux-x86_64.tar.gz" \
            "synveda-console-$version.tar.gz" \
            "synveda-reference-$version.tar.gz" \
            "synveda-plugin-$version.tar.gz" \
            "synveda-$version.tgz"; do
            test -f "assets/$asset" || { echo "missing asset: $asset" >&2; exit 1; }
          done
          echo "all six release archives are present"
      - name: Checksums
        # Unsigned (ADR-0065 decision 8): this proves a download arrived
        # intact, not who built it. install.sh says so in those words.
        run: |
          set -euo pipefail
          cd assets
          ls -lh
          sha256sum synveda-*.tar.gz synveda-*.tgz synveda-*.yaml > SHA256SUMS
          cat SHA256SUMS
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.3
      - name: Publish and pull the OCI chart
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "assets/synveda-$version.tgz" oci://ghcr.io/synveda/charts
          mkdir pulled-chart
          helm pull oci://ghcr.io/synveda/charts/synveda --version "$version" --destination pulled-chart
          cmp "assets/synveda-$version.tgz" "pulled-chart/synveda-$version.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          # The checkout also contains assets/brand and assets/product. Only
          # packaged downloads belong in the release artifact.
          path: |
            assets/SHA256SUMS
            assets/synveda-*.tar.gz
            assets/synveda-*.tgz
            assets/synveda-*.yaml
          if-no-files-found: error

  # Fresh runners and an empty Docker credential directory prove the images
  # can be downloaded by an installer with no registry publishing credentials.
  verify-images:
    needs: [version, assemble]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Use an empty Docker credential directory
        run: |
          directory="$(mktemp -d "$RUNNER_TEMP/synveda-anonymous-docker.XXXXXX")"
          echo "DOCKER_CONFIG=$directory" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: needs.version.outputs.publish == 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: assets
      - name: Verify release archive checksums
        working-directory: assets
        run: sha256sum --check SHA256SUMS
      - name: Pull and execute the released images anonymously
        if: needs.version.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          tar -xzf "assets/synveda-reference-$VERSION.tar.gz" -C "$RUNNER_TEMP"
          node scripts/verify-release-images.mjs \
            "$RUNNER_TEMP/synveda-reference-$VERSION" "$PLATFORM" \
            "$VERSION" "$SOURCE_SHA" "release-images-${{ matrix.arch }}.json"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        if: needs.version.outputs.publish == 'true'
        with:
          version: v4.2.3
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        if: needs.version.outputs.publish == 'true'
        with:
          install_only: true
          version: v0.32.0
          kubectl_version: v1.36.1
      - name: Qualify the exact Docker and chart artifacts
        if: needs.version.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # The preceding job steps pulled immutable bytes anonymously; these
          # drills must use those bytes and the packaged chart without builds.
          node scripts/qualify-release.mjs \
            "$RUNNER_TEMP/synveda-reference-$VERSION" "release-docker-${{ matrix.arch }}.json"
          node scripts/qualify-kubernetes-release.mjs \
            "$RUNNER_TEMP/synveda-reference-$VERSION" "assets/synveda-$VERSION.tgz" \
            "release-kubernetes-${{ matrix.arch }}.json"
          # Empty registry configuration also applies to Helm's OCI client.
          export HELM_REGISTRY_CONFIG="$RUNNER_TEMP/anonymous-helm.json"
          mkdir anonymous-chart
          helm pull oci://ghcr.io/synveda/charts/synveda --version "$VERSION" --destination anonymous-chart
          cmp "assets/synveda-$VERSION.tgz" "anonymous-chart/synveda-$VERSION.tgz"
      - name: Explain the dry-run boundary
        if: needs.version.outputs.publish != 'true'
        run: echo "Dry run only. Synthetic image digests are not pullable; no registry verification or publication ran."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.version.outputs.publish == 'true'
        with:
          name: release-verification-${{ matrix.arch }}
          path: |
            release-images-${{ matrix.arch }}.json
            release-docker-${{ matrix.arch }}.json
            release-kubernetes-${{ matrix.arch }}.json
          if-no-files-found: error

  publish:
    needs: [version, assemble, verify-images]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.version.outputs.publish == 'true'
        with:
          pattern: release-verification-*
          path: assets
          merge-multiple: true
      - name: Include both native verification reports
        if: needs.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd assets
          test -s release-images-amd64.json
          test -s release-images-arm64.json
          for arch in amd64 arm64; do
            test -s "release-docker-$arch.json"
            test -s "release-kubernetes-$arch.json"
          done
          sha256sum release-images-*.json release-docker-*.json release-kubernetes-*.json >> SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          # Notes in a file rather than an argument: the body is markdown
          # with fenced code in it, and quoting that through a shell is the
          # kind of cleverness that ships a release note full of backslashes.
          cat > notes.md <<NOTES
          Native client artifacts for macOS arm64 and Linux x86_64 plus the
          digest-bound Docker reference deployment. The installer does not
          start containers; use the loopback evaluation or documented HTTPS
          configuration, then use the installed \`synveda-compose\` launcher.

          For a server, download only \`synveda-reference-$version.tar.gz\`
          and \`SHA256SUMS\`: no source checkout or compiler is needed. Follow
          the [prebuilt Docker guide](https://github.com/${{ github.repository }}/blob/${GITHUB_REF_NAME}/deploy/compose/PREBUILT.md)
          for download verification, localhost first sign-in and lifecycle operations.

          Both Linux AMD64 and ARM64 jobs anonymously pulled the manifest-bound
          image set and passed isolated executable/asset smoke checks. Their
          checksummed \`release-images-*.json\` reports are attached. These
          reports distinguish executable checks from the required Docker startup,
          real OIDC browser/CLI login, sample/recreation and paired recovery drill.
          Both native runners also exercised all four provider ownership modes
          using the same candidate bytes and packaged chart in disposable Kind.
          The checksummed release-docker and release-kubernetes reports are attached.
          Docker reference live clean-host acceptance is tracked separately
          in those deployment reports from the isolated image smoke checks.
          macOS Docker Desktop, Windows/WSL2 and real OpenShift remain unqualified.
          This is a controlled single-host reference, not HA, production SaaS
          or enterprise certification.

          The database baseline is schema epoch 3; earlier epochs are refused
          and no published N-1 data upgrade is qualified by these checks.
          Keep the same runtime selection when updating an existing deployment.
          Back up both databases and matching keys first. Application/Helm
          rollback does not reverse database migrations.

          \`\`\`sh
          curl -fL https://raw.githubusercontent.com/${{ github.repository }}/${GITHUB_REF_NAME}/scripts/install.sh -o synveda-install.sh
          # Inspect synveda-install.sh before running it on a client machine.
          SYNVEDA_VERSION=${GITHUB_REF_NAME} sh synveda-install.sh
          \`\`\`

          Then give an AI client your team's governed memory:

          \`\`\`sh
          synveda plugin install                        # Claude Code
          synveda mcp install --client claude-desktop   # or cursor, or zed
          \`\`\`

          The binaries are **unsigned and not notarized** — the checksums prove
          a download arrived intact, not who built it (ADR-0065 decision 8).

          Images: \`ghcr.io/synveda/product:${{ needs.version.outputs.version }}\`,
          \`ghcr.io/synveda/postgres:${{ needs.version.outputs.version }}\`, and
          \`ghcr.io/synveda/cnpg-postgres:17.11-synveda-${{ needs.version.outputs.version }}\`.
          The bundled reference dependencies are
          \`ghcr.io/synveda/keycloak:${{ needs.version.outputs.version }}\` and
          \`ghcr.io/synveda/proxy:${{ needs.version.outputs.version }}\`.
          Helm chart: \`synveda-${{ needs.version.outputs.version }}.tgz\`.

          Kubernetes uses the checksummed \`synveda-images-$version.yaml\`
          overlay; CNPG additionally uses \`synveda-cnpg-image-$version.yaml\`.
          Follow the versioned [Kubernetes guide](https://github.com/${{ github.repository }}/blob/${GITHUB_REF_NAME}/deploy/helm/synveda/README.md).
          BuildKit emits image provenance and SBOM attestations. These do not
          constitute signature verification or a completed deployment drill.

          See [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/${GITHUB_REF_NAME}/docs/INSTALL.md).
          NOTES
          # Validate the complete flat inventory before creating a release;
          # unrelated checkout directories must never become upload arguments.
          release_assets=(
            assets/SHA256SUMS
            "assets/synveda-$version-darwin-arm64.tar.gz"
            "assets/synveda-$version-linux-x86_64.tar.gz"
            "assets/synveda-console-$version.tar.gz"
            "assets/synveda-reference-$version.tar.gz"
            "assets/synveda-plugin-$version.tar.gz"
            "assets/synveda-$version.tgz"
            "assets/synveda-cnpg-image-$version.yaml"
            "assets/synveda-images-$version.yaml"
          )
          for arch in amd64 arm64; do
            for report in images docker kubernetes; do
              release_assets+=("assets/release-$report-$arch.json")
            done
          done
          for asset in "${release_assets[@]}"; do
            test -f "$asset" && test ! -L "$asset" || {
              echo "missing or non-regular release asset: $asset" >&2
              exit 1
            }
          done
          gh release create "${GITHUB_REF_NAME}" \
            --title "Synveda ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            "${release_assets[@]}"
