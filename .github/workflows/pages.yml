name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Check every PR, including shared assets/lockfiles/docs, without filtering out
# a required check. Deployments serialize; newer PR checks may replace old ones.
concurrency:
  group: pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @synveda/website
      - name: Read configured Pages URL
        id: pages
        if: github.repository == 'synveda/synveda' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        # Enabling Pages is a manual owner action; do not enable it via API.
        with:
          enablement: false
      - name: Check brand exports and build the project site
        run: pnpm --filter @synveda/website check
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'https://synveda.github.io/synveda/' }}
      - name: Check documentation and feature records
        run: make check-docs check-backlog check-adr-status
      - name: Upload public site only
        if: matrix.runner == 'ubuntu-latest' && github.repository == 'synveda/synveda' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/dist

  deploy:
    if: github.repository == 'synveda/synveda' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
