name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      typescript: ${{ steps.select.outputs.typescript }}
      sdk: ${{ steps.select.outputs.sdk }}
      replay: ${{ steps.select.outputs.replay }}
      eval: ${{ steps.select.outputs.eval }}
      demo: ${{ steps.select.outputs.demo }}
      deploy: ${{ steps.select.outputs.deploy }}
      docker: ${{ steps.select.outputs.docker }}
      helm: ${{ steps.select.outputs.helm }}
      cli: ${{ steps.select.outputs.cli }}
      version: ${{ steps.select.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Select affected stages
        id: select
        run: node scripts/ci-select.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check documentation, generated contracts and security boundaries
        run: make check-fast check-deps check-ci
      - name: Install pinned workflow linter
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Lint workflows and expressions
        run: '"$(go env GOPATH)/bin/actionlint" -shellcheck='

  licences:
    name: Check — dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  build-test:
    name: Build and Test — Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - name: Check executable documentation
        run: make check-demos

  typescript:
    name: Build and Test — TypeScript
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '!@synveda/sdk' -r test
      - run: pnpm --filter @synveda/console build
      - run: make plugin-package-check
      - run: node scripts/check-npm-licences.mjs

  sdk:
    name: Test — SDKs
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            python: '3.11'
            interop: true
          - node: 24
            python: '3.14'
            interop: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
        if: matrix.interop
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        if: matrix.interop
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdks/python/requirements-dev.lock
      - run: pnpm install --frozen-lockfile
      - run: |
          python -m pip download --require-hashes --only-binary=:all: \
            -r sdks/python/requirements-dev.lock --dest "$RUNNER_TEMP/sdk-wheelhouse"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/sdk-wheelhouse" \
            --require-hashes -r sdks/python/requirements-dev.lock
      - run: make sdk-check sdk-package-check
        env:
          SYNVEDA_SDK_WHEELHOUSE: ${{ runner.temp }}/sdk-wheelhouse
      - run: make interop-acceptance
        if: matrix.interop


  replay:
    name: Test — Claude replay
    needs: changes
    if: needs.changes.outputs.replay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @synveda/claude-code-adapter...
      - run: make claude-acceptance

  eval:
    name: Test — deterministic evaluation
    needs: changes
    if: needs.changes.outputs.eval == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run the suite against the gate
        run: mkdir -p eval-report && make eval
        env:
          EVAL_REPORT: eval-report/report.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: eval-report-pr
          path: eval-report/
          if-no-files-found: warn


  demo:
    name: Test — product walkthrough
    needs: changes
    if: needs.changes.outputs.demo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: demos/ops-9-beta-demo.sh
      - name: What the deployment looked like
        if: failure()
        run: docker ps -a || true


  deploy:
    name: Check — deployment and packaging
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.3
      - run: make check-deploy chart-lint

      - name: Install pinned Kubernetes schema checker
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
      - name: Check Kubernetes and OpenShift schemas
        run: KUBECONFORM="$(go env GOPATH)/bin/kubeconform" make chart-schema

  helm:
    name: Helm — CNPG install and failover
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.3
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          install_only: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - run: demos/ops-2-helm-install.sh
        env:
          SYNVEDA_KIND_GHA_CACHE: "1"
      - name: What the cluster looked like
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get cluster -n synveda-test -o yaml || true
          kubectl logs -n synveda-test deployment/synveda --all-containers --tail=200 || true
          kubectl logs -n synveda-test synveda-install-test --all-containers --tail=200 || true


  helm-operations:
    name: Helm — operations
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [cnpg-packaged, external-external]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.3
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          install_only: true
          version: v0.32.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124
      - name: Source-built starter acceptance
        run: demos/ops-2-helm-install.sh
        env:
          STARTER_MATRIX: "1"
          OPERATIONS: "1"
          STARTER_CASE: ${{ matrix.profile }}
          PRODUCT_IMAGE: synveda/product:ops11
          SYNVEDA_KIND_GHA_CACHE: "1"
      - name: External TLS and OIDC negative acceptance
        if: matrix.profile == 'external-external'
        run: |
          node scripts/verify-starter-image-reuse.mjs
          demos/ops-2-helm-install.sh
        env:
          POSTGRES_MODE: external
          SKIP_BUILD: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ops11-${{ matrix.profile }}
          path: demos/evidence/ops11-operations-${{ matrix.profile }}.json
          if-no-files-found: error

  docker:
    name: Docker
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.changes.outputs.version }}

  cli:
    name: CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    uses: ./.github/workflows/cli.yml
    with:
      version: ${{ needs.changes.outputs.version }}

  result:
    name: CI Result
    if: always()
    needs: [changes, check, licences, build-test, typescript, sdk, replay, eval, demo, deploy, docker, helm, helm-operations, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Require every selected job to succeed
        run: node scripts/ci-result.mjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
