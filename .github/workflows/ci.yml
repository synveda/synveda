name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # sqlx macros compile against the committed .sqlx query cache; CI has no
      # database. Regenerate with `cargo sqlx prepare --workspace -- --all-targets`
      # against the dev compose Postgres whenever queries or migrations change.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace

  licences:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  layering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-crate-deps.mjs
      # SYNVEDA_FEATURES.md, docs/backlog/<ID>.md and STATUS.md describe one
      # feature set; this asserts they agree. It replaced the generator that
      # used to write all three (removed 2026-08-05 — regenerating discarded
      # STATUS.md's hand-written narrative), so nothing writes them now and
      # a feature added to one file and forgotten in another fails here.
      - run: node scripts/check-backlog.mjs
      # check-backlog reconciles those three files with each other and
      # never reads an ADR header. Two ADRs drifted through that gap —
      # still reading `Proposed` after their features shipped — and this
      # closes it in that one direction. The mirror check is deliberately
      # absent: CLAUDE.md requires the ADR before implementation, so
      # `Accepted` ahead of delivery is the normal state.
      - run: node scripts/check-adr-status.mjs
      # CLAUDE.md's licence rule on the corpus side (EVAL-3, ADR-0061).
      # cargo-deny governs crates and check-npm-licences governs packages;
      # a corpus is data, which is how a CC BY-NC one reached a feature
      # specification and the phase demo goal before anybody read its
      # LICENSE.txt. Here rather than in the eval job because it needs
      # nothing but node — and because a licence failure should not wait
      # behind a database.
      - run: node scripts/check-corpus-licences.mjs
      # And one class further out (OPS-2, ADR-0062 decision 11). A chart
      # references container images, which cargo-deny, check-npm-licences
      # and check-corpus-licences all miss between them. Tags are matched
      # too: bumping an image is the moment to re-read its licence, and a
      # check that ignored tags would let that moment pass.
      - run: node scripts/check-chart-images.mjs
      # The chart renders in both shapes CI covers — the minimum a real
      # install must state, and every optional path at once. Here rather
      # than in a job of its own because it needs one binary and no
      # cluster; the kind-cluster install test is the separate, slow one.
      # Pinned to the version the chart was authored and verified against,
      # so `make chart-lint` here is the run that happened there.
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - run: make chart-lint
      # docs/BENCHMARKS.md's table is generated from evals/scores/*.json
      # (EVAL-3, ADR-0061 decision 11). This asserts they still agree, so
      # a hand-typed cell in the published artefact fails a build rather
      # than becoming a claim.
      - run: node scripts/publish-benchmark.mjs

  # The gate that can block a merge (EVAL-4, ADR-0047 decision 7), which is
  # ADR-0028 option 5's own reversal trigger fired by name: it declined this
  # toll for EVAL-1's thin suite and recorded "EVAL-4 lands with
  # composition-quality scenarios" as the condition for paying it. EVAL-4's
  # AC — "composition changes show measurable quality effect before merge" —
  # is a request for it in as many words.
  #
  # The whole deterministic suite runs here: EVAL-1's scenarios, EVAL-2's
  # extraction corpus, EVAL-4's Q&A corpus and EVAL-5's security corpus,
  # against the one baseline that covers that path. The other four jobs
  # stay database-free and fast, so the toll is one parallel job rather
  # than a change to how anything else runs. The retrieval half stays
  # nightly — TEI is a ~2.3 GB model download, and that cost is exactly
  # what makes a per-PR job the wrong place for it.
  #
  # EVAL-5 (ADR-0048 decision 14) runs its corpus here at a deterministic
  # 400-variant slice — every hand-written probe plus an even spread of the
  # combinatorial tail — rather than at the nightly's 10,000. The leak
  # counts are gated at zero on both paths, because zero is zero; only the
  # coverage floors differ. A product that blocks a merge on
  # `tokens_per_answer` rising and not on `restricted` material reaching a
  # reader has recorded its priorities backwards.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Postgres only; no IdP and no model server (ADR-0028 decision 6).
      - name: Start Postgres
        run: docker compose -f deploy/compose/docker-compose.yml up --detach --wait postgres

      - name: Run the suite against the gate
        run: mkdir -p eval-report && make eval
        env:
          EVAL_REPORT: eval-report/report.json

      # A failed gate still uploads it: that is the run someone needs to
      # read, axis by axis and scope tier by scope tier.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-pr
          path: eval-report/
          if-no-files-found: warn

  # OPS-2's acceptance criterion (ADR-0062 decision 7). The only job that
  # asks the gateway *image* to serve: ADR-0055 built it and could not
  # exercise it, because the bundled IdP's issuer is a `localhost` URL and
  # RFC 6761 makes that the caller's own loopback. A Service DNS name is a
  # real name, so in a cluster the gateway and the client resolve the
  # issuer to the same place.
  #
  # It asserts a governed round trip, a CloudNativePG failover and a live
  # RLS backstop — never readiness. "Every pod is Ready" is the shape
  # EVAL-3's first complete run had: a validity guard that passed when
  # there was nothing to validate.
  #
  # Budget: 20 minutes, of which the cold Rust release build inside the
  # image is most. If it cannot hold that once layer caching settles, the
  # split is chart-lint on every PR (it already runs in `layering`) and
  # this on a nightly — the same division `eval` makes between its
  # deterministic half and its retrieval half, for the same reason.
  # OPS-8's acceptance criterion (ADR-0065). The only job that exercises
  # the *installer* — `scripts/install.sh` itself, against packaged release
  # artefacts, with `cargo`, `rustc` and `rustup` shadowed by shims that
  # exit 127. That last part is what makes "no Rust toolchain" a property of
  # the run rather than a sentence in a README.
  #
  # It is also the only job that would notice `deploy/release/` drifting
  # from the product: it installs from the tarball `scripts/package-release.sh`
  # produces, not from the tree (ADR-0065 decision 3 chose this over a lint,
  # because a checker comparing two compose files can only prove they are
  # similar).
  #
  # Budget: 45 minutes, and **unmeasured on a GitHub runner** — the same
  # honesty OPS-2 recorded about its own. The variables are a cold Rust
  # release build and the Postgres image, which compiles AGE from source.
  # If it cannot hold, this moves to a nightly and the unit tests around
  # `Profile` stay on every PR.
  release-install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      # The demo installs what it needs itself, so it runs on a fresh clone
      # rather than only where a job happened to prime the store. This step
      # stays because a warm store is most of its untimed half — and it
      # names *both* filters, which the first run did not: the adapter's
      # `typescript` was missing and the plugin build failed inside the demo.
      - run: >
          pnpm install --frozen-lockfile
          --filter @synveda/console...
          --filter @synveda/claude-code-adapter...
      - run: demos/ops-8-release-install.sh
      - name: What the install looked like
        if: failure()
        run: docker ps -a || true

  # OPS-9's acceptance demo (ADR-0066). Separate from `release-install`
  # rather than appended to it, because the two answer different questions
  # and a job that answered both would report neither: OPS-8 asks whether a
  # stranger can install this, and OPS-9 asks what they see once they have.
  #
  # It runs against a dev stack rather than a packaged release — the demo's
  # own header says why, and `package-release.sh` covers the part this
  # leaves out by asserting the bundle carries the seeder, executable and
  # syntactically valid.
  beta-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p synveda-cli -p synveda-gateway --release
      - run: demos/ops-9-beta-demo.sh
      - name: What the deployment looked like
        if: failure()
        run: docker ps -a || true

  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: demos/ops-2-helm-install.sh
      - name: What the cluster looked like
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get cluster -n synveda-test -o yaml || true
          kubectl logs -n synveda-test deployment/synveda --all-containers --tail=200 || true
          kubectl logs -n synveda-test synveda-install-test --all-containers --tail=200 || true

  typescript:
    runs-on: ubuntu-latest
    # This job used to never finish: it stalled and was killed six hours
    # later by GitHub's default ceiling, which is why it read `cancelled`
    # rather than `failed` and went unseen by every survey of what was
    # failing. --test-timeout in the adapter's own script named the file,
    # `dist/log.test.mjs`, and the cause under it turned out to be the
    # product's: `mkdirSync(recursive)` spins forever — not blocks — on a
    # path under /proc, which is where that suite pointed $XDG_STATE_HOME
    # to get an unwritable directory. Fixed 2026-08-01 (paths.ensureDir).
    # Both bounds stay: together they are what turns six hours of silence
    # into a failure carrying a filename.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # CLAUDE.md's licence rule on the npm side (CNSL-1, ADR-0056
      # decision 8) — the gate cargo-deny gives the Rust side. After the
      # install, because it reads the resolved tree.
      - run: node scripts/check-npm-licences.mjs
      # The adapter suites (ADPT-1) and the console's (CNSL-1); packages
      # without a test script are skipped.
      - run: pnpm -r test
