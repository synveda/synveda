name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# FND-1 / ADR-0108: only the newest revision of a PR or branch needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            python: '3.11'
            interop: true
          - node: 24
            python: '3.14'
            interop: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
        if: matrix.interop
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        if: matrix.interop
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdks/python/requirements-dev.lock
      - run: pnpm install --frozen-lockfile
      - run: |
          python -m pip download --require-hashes --only-binary=:all: \
            -r sdks/python/requirements-dev.lock --dest "$RUNNER_TEMP/sdk-wheelhouse"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/sdk-wheelhouse" \
            --require-hashes -r sdks/python/requirements-dev.lock
      - run: make sdk-check sdk-package-check
        env:
          SYNVEDA_SDK_WHEELHOUSE: ${{ runner.temp }}/sdk-wheelhouse
      - run: make interop-acceptance
        if: matrix.interop

  # CPR-14 tier 2: captured real-client frames, but no Claude credential,
  # through the public session API and a real current-epoch database. This is
  # labelled replay in both the test and its output; only the separately run
  # make claude-acceptance-live target may claim a real client execution.
  claude-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @synveda/claude-code-adapter...
      - run: make claude-acceptance

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # sqlx macros compile against the committed .sqlx query cache; CI has no
      # database. Regenerate and immediately verify through the fresh exact-role
      # fixture with `SYNVEDA_DB_TEST_TASK=sqlx-prepare bash scripts/db-test.sh`.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Tests enable gateway test-support; also compile the production features.
      - run: cargo build --workspace

  licences:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  layering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/check-crate-deps.mjs
      # The frontend's types are generated from the OpenAPI document, which is
      # generated from the gateway's own handlers (CPR-4, ADR-0071 decision 7).
      # The Rust half of that chain is
      # crates/synveda-gateway/tests/openapi.rs, in the `rust` job above; this
      # is the TypeScript half, and it lives here because it needs node and
      # nothing else.
      - run: node scripts/generate-api-types.mjs --check
      # STATUS is the feature inventory. Open work must have one
      # implementation-ready brief; delivered history stays in git.
      - run: make check-backlog
      # check-backlog does not read ADR headers. This closes the useful half
      # of that gap: a delivered feature must not retain a Proposed ADR. The
      # reverse is intentionally allowed because AGENTS.md requires the ADR
      # before implementation.
      - run: node scripts/check-adr-status.mjs
      # Current documents/open briefs must resolve internal links and paths;
      # historical ADR/spike prose remains link-checked without becoming a
      # current product claim.
      - run: make check-docs
      # The repository licence rule on the corpus side (EVAL-3, ADR-0061).
      # cargo-deny governs crates and check-npm-licences governs packages;
      # a corpus is data, which is how a CC BY-NC one reached a feature
      # specification and the phase demo goal before anybody read its
      # LICENSE.txt. Here rather than in the eval job because it needs
      # nothing but node — and because a licence failure should not wait
      # behind a database.
      - run: node scripts/check-corpus-licences.mjs
      # The chart renders in both shapes CI covers — the minimum a real
      # install must state, and every optional path at once. Here rather
      # than in a job of its own because it needs one binary and no
      # cluster; the kind-cluster install test is the separate, slow one.
      # Pinned to the version the chart was authored and verified against,
      # so `make chart-lint` here is the run that happened there.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.3
      - run: make chart-lint
      # docs/BENCHMARKS.md's table is generated from evals/scores/*.json
      # (EVAL-3, ADR-0061 decision 11). This asserts they still agree, so
      # a hand-typed cell in the published artefact fails a build rather
      # than becoming a claim.
      - run: node scripts/publish-benchmark.mjs

  # The gate that can block a merge (EVAL-4, ADR-0047 decision 7), which is
  # ADR-0028 option 5's own reversal trigger fired by name: it declined this
  # toll for EVAL-1's thin suite and recorded "EVAL-4 lands with
  # composition-quality scenarios" as the condition for paying it. EVAL-4's
  # AC — "composition changes show measurable quality effect before merge" —
  # is a request for it in as many words.
  #
  # The whole deterministic suite runs here: EVAL-1's scenarios, EVAL-2's
  # extraction corpus, EVAL-4's Q&A corpus and EVAL-5's security corpus,
  # against the one baseline that covers that path. It runs independently
  # of the frontend and static checks. The retrieval half stays
  # nightly — TEI is a ~2.3 GB model download, and that cost is exactly
  # what makes a per-PR job the wrong place for it.
  #
  # EVAL-5 (ADR-0048 decision 14) runs its corpus here at a deterministic
  # 400-variant slice — every hand-written probe plus an even spread of the
  # combinatorial tail — rather than at the nightly's 10,000. The leak
  # counts are gated at zero on both paths, because zero is zero; only the
  # coverage floors differ. A product that blocks a merge on
  # `tokens_per_answer` rising and not on `restricted` material reaching a
  # reader has recorded its priorities backwards.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run the suite against the gate
        # `make eval` owns one fresh exact-role PostgreSQL fixture. No legacy
        # owner database, IdP or model server participates in this job.
        run: mkdir -p eval-report && make eval
        env:
          EVAL_REPORT: eval-report/report.json

      # A failed gate still uploads it: that is the run someone needs to
      # read, axis by axis and scope tier by scope tier.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: eval-report-pr
          path: eval-report/
          if-no-files-found: warn

  # OPS-8/CPR-45 release contract. It executes the real installer against a
  # freshly packaged digest-bound reference, proves repeat installation keeps
  # mutable state, and checks the current reference/Helm boundaries. It
  # does not publish or pull release images and therefore is not live install
  # evidence.
  release-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.3
      # This target owns deployment/installer/image checks once per CI run.
      # OpenAPI is tested by `rust`; lifecycle epoch tests need `make db-test`.
      - run: make check-deploy

  # OPS-9's acceptance demo (ADR-0066). Separate from `release-install`
  # rather than appended to it, because the two answer different questions
  # and a job that answered both would report neither: OPS-8 asks whether a
  # stranger can install this, and OPS-9 asks what they see once they have.
  #
  # It runs against the same fresh exact-role database fixture as current
  # feature demos. The release-install gate separately owns packaged-reference
  # acceptance; this job measures only the authenticated product experience.
  beta-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The demo builds its debug-profile test through the exact-role fixture.
      - run: demos/ops-9-beta-demo.sh
      - name: What the deployment looked like
        if: failure()
        run: docker ps -a || true

  # OPS-2: real Dockerfile builds, issuer login, governed round trip, CNPG
  # failover and forced RLS. Caching never substitutes for this acceptance.
  kind:
    runs-on: ubuntu-latest
    # Includes cold compilation plus exporting all intermediate build layers.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.3
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          install_only: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Shell-invoked Buildx needs the cache runtime environment explicitly.
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - run: demos/ops-2-helm-install.sh
        env:
          SYNVEDA_KIND_GHA_CACHE: "1"
      - name: What the cluster looked like
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get cluster -n synveda-test -o yaml || true
          kubectl logs -n synveda-test deployment/synveda --all-containers --tail=200 || true
          kubectl logs -n synveda-test synveda-install-test --all-containers --tail=200 || true

  # OPS-11: clean namespaces and native recovery tools; no cloud credentials.
  # Keep the existing CNPG failover and Compose smoke gates independent.
  kind-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [cnpg-packaged, external-external]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.3
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          install_only: true
          version: v0.32.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124
      - run: make chart-lint
      - name: Install the pinned structural schema checker
        if: matrix.profile == 'cnpg-packaged'
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
      - name: Validate Kubernetes and OpenShift structural schemas
        if: matrix.profile == 'cnpg-packaged'
        run: KUBECONFORM="$(go env GOPATH)/bin/kubeconform" make chart-schema
      - run: demos/ops-2-helm-install.sh
        env:
          STARTER_MATRIX: "1"
          OPERATIONS: "1"
          STARTER_CASE: ${{ matrix.profile }}
          SYNVEDA_KIND_GHA_CACHE: "1"
      - name: External TLS and OIDC negative acceptance
        if: matrix.profile == 'external-external'
        run: POSTGRES_MODE=external demos/ops-2-helm-install.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ops11-${{ matrix.profile }}
          path: demos/evidence/ops11-operations-${{ matrix.profile }}.json
          if-no-files-found: error

  typescript:
    runs-on: ubuntu-latest
    # Keep a job bound in addition to each package's test timeout so a wedged
    # runtime reports promptly instead of consuming the runner indefinitely.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Test scripts compile the adapters before archive replay. SDK source
      # and installed-package tests belong to both `sdk-interop` matrix rows.
      - run: pnpm --filter '!@synveda/sdk' -r test
      # Vite's production bundle is distinct from the console test build.
      - run: pnpm --filter @synveda/console build
      - run: make plugin-package-check
      # The npm counterpart to cargo-deny; it reads the resolved install.
      - run: node scripts/check-npm-licences.mjs
