name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # sqlx macros compile against the committed .sqlx query cache; CI has no
      # database. Regenerate with `cargo sqlx prepare --workspace -- --all-targets`
      # against the dev compose Postgres whenever queries or migrations change.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace

  licences:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  layering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-crate-deps.mjs

  # The gate that can block a merge (EVAL-4, ADR-0047 decision 7), which is
  # ADR-0028 option 5's own reversal trigger fired by name: it declined this
  # toll for EVAL-1's thin suite and recorded "EVAL-4 lands with
  # composition-quality scenarios" as the condition for paying it. EVAL-4's
  # AC — "composition changes show measurable quality effect before merge" —
  # is a request for it in as many words.
  #
  # The whole deterministic suite runs here: EVAL-1's scenarios, EVAL-2's
  # extraction corpus, EVAL-4's Q&A corpus and EVAL-5's security corpus,
  # against the one baseline that covers that path. The other four jobs
  # stay database-free and fast, so the toll is one parallel job rather
  # than a change to how anything else runs. The retrieval half stays
  # nightly — TEI is a ~2.3 GB model download, and that cost is exactly
  # what makes a per-PR job the wrong place for it.
  #
  # EVAL-5 (ADR-0048 decision 14) runs its corpus here at a deterministic
  # 400-variant slice — every hand-written probe plus an even spread of the
  # combinatorial tail — rather than at the nightly's 10,000. The leak
  # counts are gated at zero on both paths, because zero is zero; only the
  # coverage floors differ. A product that blocks a merge on
  # `tokens_per_answer` rising and not on `restricted` material reaching a
  # reader has recorded its priorities backwards.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Postgres only; no IdP and no model server (ADR-0028 decision 6).
      - name: Start Postgres
        run: docker compose -f deploy/compose/docker-compose.yml up --detach --wait postgres

      - name: Run the suite against the gate
        run: mkdir -p eval-report && make eval
        env:
          EVAL_REPORT: eval-report/report.json

      # A failed gate still uploads it: that is the run someone needs to
      # read, axis by axis and scope tier by scope tier.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-pr
          path: eval-report/
          if-no-files-found: warn

  typescript:
    runs-on: ubuntu-latest
    # This job used to never finish: it stalled and was killed six hours
    # later by GitHub's default ceiling, which is why it read `cancelled`
    # rather than `failed` and went unseen by every survey of what was
    # failing. --test-timeout in the adapter's own script named the file,
    # `dist/log.test.mjs`, and the cause under it turned out to be the
    # product's: `mkdirSync(recursive)` spins forever — not blocks — on a
    # path under /proc, which is where that suite pointed $XDG_STATE_HOME
    # to get an unwritable directory. Fixed 2026-08-01 (paths.ensureDir).
    # Both bounds stay: together they are what turns six hours of silence
    # into a failure carrying a filename.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # The adapter suites (ADPT-1); packages without a test script are skipped.
      - run: pnpm -r test
