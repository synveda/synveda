name: Eval

# The eval gate (EVAL-1, ADR-0028 decision 8). It needs a live stack, so
# it runs nightly rather than on every pull request — that is the trade:
# a regression is caught within a day, and `ci.yml` stays database-free
# and fast. `workflow_dispatch` is there for the day you want it before a
# merge; EVAL-4's composition scenarios are the trigger to move it onto
# the pull-request path for good.
#
# `make eval` covers both suites: the scenario suite and EVAL-2's labelled
# extraction corpus (ADR-0046), which needs no wiring here because the
# runner defaults to evals/fixtures/extraction. Deliberately absent is the
# live-model measurement — `make eval-extraction-live` needs a key this
# workflow does not hold, and a nightly that pages on model drift is the
# thing ADR-0028 decision 6 refused.
on:
  schedule:
    # 03:00 UTC, after the day's merges and before anyone reads it.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    # ADPT-1's lesson, applied to the workflow it was not applied to: an
    # unbounded job that stalls is killed six hours later and reports
    # `cancelled`, which every survey filtering on failure answers cleanly.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The harness brings up its own scratch database inside the compose
      # postgres; nothing else from the dev environment is needed — no
      # IdP, no model server (ADR-0028 decision 6).
      - name: Start Postgres
        run: docker compose -f deploy/compose/docker-compose.yml up --detach --wait postgres

      # The report is the artefact: axis by axis, scenario by scenario,
      # and class by class, with each block's watermark and — for the
      # extraction half — what the pipeline committed beside what a reader
      # was served, so a withheld record does not read as a missed
      # extraction. A failed gate still uploads it: that is the run
      # someone needs to read.
      - name: Run the suite against the gate
        run: mkdir -p eval-report && make eval
        env:
          EVAL_REPORT: eval-report/report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report/
          if-no-files-found: warn

  # EVAL-4's retrieval half (ADR-0047 decision 6): the same Q&A corpus with
  # real BGE-M3 embeddings, so the dense leg means something and the
  # `semantic` questions are measured rather than skipped. Its own baseline,
  # because a hash embedder's geometry carries none by construction.
  #
  # A separate job on purpose: TEI downloading a 2.3 GB model is a failure
  # mode that is not a product regression, and folding it into the job above
  # would let it mask a composition result someone needs. It is also why
  # this half is not on the pull-request path — `ci.yml` runs the
  # deterministic suite, which needs Postgres and nothing else.
  retrieval:
    runs-on: ubuntu-latest
    # The healthcheck this job now relies on allows a first model load
    # 1800s, and the run itself takes ~20 minutes, so the bound is above
    # their sum rather than near it.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `--wait` means something here now: the `tei` service declares a
      # healthcheck (2026-08-01). Before that it returned the moment the
      # container started, ~2.3 GB of model download early. A cold load
      # measures 2m01s, and this step is where that time is spent now —
      # previously the Rust build happened to absorb it.
      - name: Start Postgres and TEI
        run: |
          docker compose -f deploy/compose/docker-compose.yml \
            up --detach --wait postgres tei

      - name: Run the Q&A corpus with real embeddings
        run: mkdir -p retrieval-report && make eval-retrieval
        env:
          EVAL_REPORT: retrieval-report/report.json

      # A run that commits nothing is a statement about the embedder, and
      # this is where the embedder speaks. The gateway's own log rides in
      # the artifact below, next to the report (evals/lib.sh).
      - name: What TEI did, when the run failed
        if: failure()
        run: |
          docker compose -f deploy/compose/docker-compose.yml \
            logs --no-color --tail 300 tei

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-retrieval
          path: retrieval-report/
          if-no-files-found: warn

  # EVAL-5's security suite at the full variant budget (ADR-0048). The
  # pull-request job in ci.yml already runs the same corpus at a
  # deterministic 400-variant slice; this is the run the acceptance
  # criterion's 10,000 belongs to, and it takes minutes rather than
  # seconds because ten thousand phrasings over four surfaces is what
  # "under 10k generated query variants" asks for.
  #
  # A separate job for the reason the retrieval one is separate: its
  # failure modes are its own. A slow pipeline here reads as a corpus that
  # never became retrievable, and folding that into the job above would
  # let it mask a composition result someone needs.
  #
  # Postgres only. Both admitted tenants live in the one scratch database
  # the harness creates, so the cross-tenant half needs no extra service —
  # what makes a foreign probe real is that the token carries the tenant,
  # not that the storage is somewhere else.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start Postgres
        run: docker compose -f deploy/compose/docker-compose.yml up --detach --wait postgres

      - name: Run the security corpus at the full variant budget
        run: mkdir -p security-report && make eval-security
        env:
          EVAL_REPORT: security-report/report.json

      # A failed gate still uploads it, and here that matters more than
      # anywhere else: the report names the record, the reader, the
      # surface, the phrasing and the probe index, which are the five
      # things needed to reproduce a disclosure.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-security
          path: security-report/
          if-no-files-found: warn
