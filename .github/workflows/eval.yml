name: Extended Tests

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    name: Deterministic evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run the suite against the gate
        run: mkdir -p eval-report && make eval
        env:
          EVAL_REPORT: eval-report/report.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: eval-report
          path: eval-report/
          if-no-files-found: warn

  retrieval:
    name: Semantic retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run the Q&A corpus with real embeddings
        run: mkdir -p retrieval-report && make eval-retrieval
        env:
          EVAL_REPORT: retrieval-report/report.json

      - name: What TEI did, when the run failed
        if: failure()
        run: |
          docker compose -p synveda-retrieval-eval \
            -f evals/compose.retrieval.yaml --profile semantic \
            logs --no-color --tail 300 tei

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: eval-report-retrieval
          path: retrieval-report/
          if-no-files-found: warn

  security:
    name: Security — 10,000 variants
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run the security corpus at the full variant budget
        run: mkdir -p security-report && make eval-security
        env:
          EVAL_REPORT: security-report/report.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: eval-report-security
          path: security-report/
          if-no-files-found: warn
