name: Eval

# The eval gate (EVAL-1, ADR-0028 decision 8). It needs a live stack, so
# it runs nightly rather than on every pull request — that is the trade:
# a regression is caught within a day, and `ci.yml` stays database-free
# and fast. `workflow_dispatch` is there for the day you want it before a
# merge; EVAL-4's composition scenarios are the trigger to move it onto
# the pull-request path for good.
#
# `make eval` covers both suites: the scenario suite and EVAL-2's labelled
# extraction corpus (ADR-0046), which needs no wiring here because the
# runner defaults to evals/fixtures/extraction. Deliberately absent is the
# live-model measurement — `make eval-extraction-live` needs a key this
# workflow does not hold, and a nightly that pages on model drift is the
# thing ADR-0028 decision 6 refused.
on:
  schedule:
    # 03:00 UTC, after the day's merges and before anyone reads it.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The harness brings up its own scratch database inside the compose
      # postgres; nothing else from the dev environment is needed — no
      # IdP, no model server (ADR-0028 decision 6).
      - name: Start Postgres
        run: docker compose -f deploy/compose/docker-compose.yml up --detach --wait postgres

      # The report is the artefact: axis by axis, scenario by scenario,
      # and class by class, with each block's watermark and — for the
      # extraction half — what the pipeline committed beside what a reader
      # was served, so a withheld record does not read as a missed
      # extraction. A failed gate still uploads it: that is the run
      # someone needs to read.
      - name: Run the suite against the gate
        run: mkdir -p eval-report && make eval
        env:
          EVAL_REPORT: eval-report/report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report/
          if-no-files-found: warn

  # EVAL-4's retrieval half (ADR-0047 decision 6): the same Q&A corpus with
  # real BGE-M3 embeddings, so the dense leg means something and the
  # `semantic` questions are measured rather than skipped. Its own baseline,
  # because a hash embedder's geometry carries none by construction.
  #
  # A separate job on purpose: TEI downloading a 2.3 GB model is a failure
  # mode that is not a product regression, and folding it into the job above
  # would let it mask a composition result someone needs. It is also why
  # this half is not on the pull-request path — `ci.yml` runs the
  # deterministic suite, which needs Postgres and nothing else.
  retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start Postgres and TEI
        run: |
          docker compose -f deploy/compose/docker-compose.yml \
            up --detach --wait postgres tei

      - name: Run the Q&A corpus with real embeddings
        run: mkdir -p retrieval-report && make eval-retrieval
        env:
          EVAL_REPORT: retrieval-report/report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-retrieval
          path: retrieval-report/
          if-no-files-found: warn
