[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

# Internal crates. The dependency rule (seed §8):
#   types ← {policy, store, identity, audit, vedaflow} ← retrieval/ingest ← gateway
# Nothing imports upward. Enforced by scripts/check-crate-deps.mjs in CI.
[workspace.dependencies]
synveda-types = { path = "crates/synveda-types" }
synveda-policy = { path = "crates/synveda-policy" }
synveda-store = { path = "crates/synveda-store" }
synveda-identity = { path = "crates/synveda-identity" }
synveda-audit = { path = "crates/synveda-audit" }
synveda-vedaflow = { path = "crates/synveda-vedaflow" }
synveda-retrieval = { path = "crates/synveda-retrieval" }
synveda-ingest = { path = "crates/synveda-ingest" }

# External dependencies (MIT/Apache-2.0 only in the core path — deny.toml enforces).
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
# HS256 verification for the pre-AUTH-1 dev token mode (ADR-0008); RustCrypto
# primitives, constant-time verify. AUTH-1 adds the real OIDC/JWKS verifier.
hmac = "0.12"
sha2 = "0.10"
# The `metrics` facade is the only metrics dependency below the gateway; the
# Prometheus recorder is installed by the gateway alone (ADR-0007).
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# OpenTelemetry SDK + OTLP export: gateway-only (ADR-0007). Lower crates
# instrument with the `tracing` facade and never see these.
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic",
    "trace",
] }
opentelemetry_sdk = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No TLS feature on purpose: dev connections are plain; the production TLS
# backend is chosen (and licence-reviewed) when a deployment needs it.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }
thiserror = "2"
tower-http = { version = "0.7", default-features = false, features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v7"] }

# Test-only dependencies.
http-body-util = "0.1"
proptest = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
