[workspace]
resolver = "3"
members = ["crates/*"]

# Cedar evaluation is pure CPU on the request hot path. Keep the engine
# optimized even in dev/test builds (test inherits dev) so the AUTHZ-1
# µs-level decision benchmark measures reality — unoptimized Cedar is an
# order of magnitude slower — and every dev-loop request pays µs, not ms.
[profile.dev.package.cedar-policy]
opt-level = 3
[profile.dev.package.cedar-policy-core]
opt-level = 3
[profile.dev.package.cedar-policy-formatter]
opt-level = 3

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

# Internal crates. The dependency rule (seed §8):
#   types ← {policy, store, identity, audit, vedaflow} ← retrieval/ingest ← gateway
# Nothing imports upward. Enforced by scripts/check-crate-deps.mjs in CI.
[workspace.dependencies]
synveda-types = { path = "crates/synveda-types" }
synveda-policy = { path = "crates/synveda-policy" }
synveda-store = { path = "crates/synveda-store" }
synveda-identity = { path = "crates/synveda-identity" }
synveda-audit = { path = "crates/synveda-audit" }
synveda-vedaflow = { path = "crates/synveda-vedaflow" }
synveda-retrieval = { path = "crates/synveda-retrieval" }
synveda-ingest = { path = "crates/synveda-ingest" }

# External dependencies (MIT/Apache-2.0 only in the core path — deny.toml enforces).
# Object-safe async traits (TokenVerifier went async with AUTH-1, ADR-0010).
async-trait = "0.1"
# The embedded PDP (AUTHZ-1, ADR-0002/ADR-0012): pure Rust, in-process,
# Apache-2.0, formally verified evaluator.
cedar-policy = "4"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
# CSPRNG for OIDC state/nonce/PKCE-verifier entropy (AUTH-1, ADR-0010).
getrandom = "0.3"
# HS256 verification for the dev token mode (ADR-0008); RustCrypto
# primitives, constant-time verify. OIDC/JWKS is the real mode (ADR-0010).
hmac = "0.12"
# OIDC token verification (AUTH-1, ADR-0010). The rust_crypto backend only —
# the aws-lc backend carries licences deny.toml does not admit, and exactly
# one backend umbrella feature must be enabled for provider selection.
jsonwebtoken = { version = "10", default-features = false, features = [
    "use_pem",
    "rust_crypto",
] }
# OIDC discovery/JWKS/token-endpoint client (AUTH-1, ADR-0010). No TLS
# feature on purpose (same doctrine as sqlx below): dev IdPs are plain-http
# localhost; the production TLS backend is chosen (and licence-reviewed)
# when a deployment needs it.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sha2 = "0.10"
# The `metrics` facade is the only metrics dependency below the gateway; the
# Prometheus recorder is installed by the gateway alone (ADR-0007).
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# OpenTelemetry SDK + OTLP export: gateway-only (ADR-0007). Lower crates
# instrument with the `tracing` facade and never see these.
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic",
    "trace",
] }
opentelemetry_sdk = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No TLS feature on purpose: dev connections are plain; the production TLS
# backend is chosen (and licence-reviewed) when a deployment needs it.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }
thiserror = "2"
tower-http = { version = "0.7", default-features = false, features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }

# Test-only dependencies.
http-body-util = "0.1"
proptest = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
