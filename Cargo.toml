[workspace]
resolver = "3"
members = ["crates/*"]

# Full debuginfo is what makes `target/debug` grow without bound: unpacked
# `.o` files are the macOS default, and this workspace's dep graph turns
# that into hundreds of gigabytes and over a million files. Cargo never
# GCs `target/`, so the cost lands on every later invocation as fingerprint
# stat traffic — a no-op `cargo check` measured 151s of system time at 9%
# CPU against a 295G tree. Line tables keep backtraces pointing at
# file:line, which is what the test suites and demos actually read;
# stepping through locals in a debugger needs `debug = 2` set back.
[profile.dev]
debug = "line-tables-only"
# Build scripts and proc-macro crates are dependencies of `cargo check`,
# not just of `cargo build` — check still expands every macro. This tree
# expands 578 `sqlx::query!`/`query_as!` invocations, each of which parses
# SQL and type-checks it against `.sqlx`, plus `utoipa-gen` over the
# gateway's handlers and `serde_derive` almost everywhere. Compiling the
# expanders unoptimized makes every one of those slower. Same reasoning as
# the cedar/tantivy overrides below, applied to compile time instead of
# request time.
[profile.dev.build-override]
opt-level = 3

# Cedar evaluation is pure CPU on the request hot path. Keep the engine
# optimized even in dev/test builds (test inherits dev) so the AUTHZ-1
# µs-level decision benchmark measures reality — unoptimized Cedar is an
# order of magnitude slower — and every dev-loop request pays µs, not ms.
[profile.dev.package.cedar-policy]
opt-level = 3
[profile.dev.package.cedar-policy-core]
opt-level = 3
[profile.dev.package.cedar-policy-formatter]
opt-level = 3
# Tantivy is the same story on the read path (CTX-1, ADR-0024): BM25
# scoring and segment writing are pure CPU, and the latency AC test
# indexes a million documents. Same reasoning, same precedent.
[profile.dev.package.tantivy]
opt-level = 3
[profile.dev.package.tantivy-common]
opt-level = 3
[profile.dev.package.tantivy-fst]
opt-level = 3
[profile.dev.package.tantivy-columnar]
opt-level = 3
[profile.dev.package.tantivy-sstable]
opt-level = 3
[profile.dev.package.tantivy-stacker]
opt-level = 3
[profile.dev.package.tantivy-bitpacker]
opt-level = 3

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
publish = false

# Internal crates. The dependency rule (seed §8; synveda-crypto added by
# TEN-4, ADR-0064 decision 13):
#   types ← crypto ← {policy, store, identity, audit, vedaflow} ← retrieval/ingest ← gateway
# Nothing imports upward. Enforced by scripts/check-crate-deps.mjs in CI.
[workspace.dependencies]
synveda-types = { path = "crates/synveda-types" }
synveda-crypto = { path = "crates/synveda-crypto" }
synveda-policy = { path = "crates/synveda-policy" }
synveda-store = { path = "crates/synveda-store" }
synveda-identity = { path = "crates/synveda-identity" }
synveda-audit = { path = "crates/synveda-audit" }
synveda-vedaflow = { path = "crates/synveda-vedaflow" }
synveda-retrieval = { path = "crates/synveda-retrieval" }
synveda-ingest = { path = "crates/synveda-ingest" }
synveda-okf = { path = "crates/synveda-okf" }

# External dependencies (MIT/Apache-2.0 only in the core path — deny.toml enforces).
# Object-safe async traits (TokenVerifier went async with AUTH-1, ADR-0010).
async-trait = "0.1"
# The embedded PDP (AUTHZ-1, ADR-0002/ADR-0012): pure Rust, in-process,
# Apache-2.0, formally verified evaluator.
cedar-policy = "4"
axum = "0.8"
base64 = "0.22"
# The audit chain's hash (AUD-1, ADR-0019); VedaFlow's content addressing
# uses the same primitive later (FLOW-1, tech plan §2.1). Apache-2.0.
blake3 = "1"
# Envelope sealing (TEN-4, ADR-0064 decision 3). RustCrypto, MIT/Apache-2.0.
# XChaCha rather than AES-GCM for its 192-bit nonce: random nonces stay safe
# without a counter any process has to own, which is the property that
# survives OPS-7 making the gateway multi-process.
chacha20poly1305 = { version = "0.10", default-features = false, features = [
    "alloc",
] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
# VedaFlow commit signatures (FLOW-1, ADR-0030 decision 9). BSD-3-Clause,
# already a reviewed deny.toml exception from AUTH-1 (it arrives through
# jsonwebtoken's rust_crypto backend); taken directly here. `rand_core` is
# deliberately off — signing keys arrive as configuration, never generated
# in-process.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# CSPRNG for OIDC state/nonce/PKCE-verifier entropy (AUTH-1, ADR-0010).
getrandom = "0.3"
# HS256 verification for the dev token mode (ADR-0008); RustCrypto
# primitives, constant-time verify. OIDC/JWKS is the real mode (ADR-0010).
hmac = "0.12"
# OIDC token verification (AUTH-1, ADR-0010). The rust_crypto backend only —
# the aws-lc backend carries licences deny.toml does not admit, and exactly
# one backend umbrella feature must be enabled for provider selection.
jsonwebtoken = { version = "10", default-features = false, features = [
    "use_pem",
    "rust_crypto",
] }
# JSONC with byte ranges, for `synveda mcp install --client zed` (ADPT-2,
# ADR-0057 decision 10 as amended). Zed's settings.json is a file its owner
# edits — comments, trailing commas — which serde_json rejects outright and
# a formatter would strip. This parses it for ranges so the one key we write
# is spliced textually and everything else survives byte-for-byte. MIT.
jsonc-parser = { version = "0.33", default-features = false, features = [
    "cst",
    "serde_json",
] }
# The redaction scanner (MEM-2, ADR-0021): finite automata only — no
# backtracking, so a hostile payload cannot pathologically slow the ack
# path. MIT/Apache-2.0.
regex = "1"
# OIDC discovery/JWKS/token-endpoint client (AUTH-1, ADR-0010) and the
# extraction LLM clients (MEM-3, ADR-0022). native-tls is the reviewed TLS
# backend for the Claude API: schannel on Windows, OpenSSL 3 (Apache-2.0)
# on Linux — the rustls stack pulls ring/aws-lc, whose licences deny.toml
# does not admit (same reasoning as jsonwebtoken above).
# The official MCP Rust SDK (ADPT-2, ADR-0057 as amended). Server + stdio
# only: `transport-io` rather than the HTTP transports, so no second
# listener and no reqwest tree enters the CLI for this.
rmcp = { version = "3.1", default-features = false, features = ["server", "macros", "transport-io"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "native-tls",
] }
sha2 = "0.10"
# The BM25 sidecar (CTX-1, ADR-0024): per-tenant lexical indexes in
# `synveda-retrieval`, MIT — the tech plan's "BM25 quality without
# ParadeDB's AGPL" (§1.1).
tantivy = "0.26"
# The `metrics` facade is the only metrics dependency below the gateway; the
# Prometheus recorder is installed by the gateway alone (ADR-0007).
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# OpenTelemetry SDK + OTLP export: gateway-only (ADR-0007). Lower crates
# instrument with the `tracing` facade and never see these.
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic",
    "trace",
] }
opentelemetry_sdk = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OKF v0.2 is Markdown with YAML frontmatter. The adapter parses YAML as an
# external exchange format and immediately projects it into bounded JSON;
# Synveda's own persisted/configuration formats remain JSON (CPR-27,
# ADR-0087). MIT/Apache-2.0.
serde_yaml = "0.9"
# No TLS feature on purpose: dev connections are plain; the production TLS
# backend is chosen (and licence-reviewed) when a deployment needs it.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }
thiserror = "2"
# `fs` and `set-header` added with CNSL-1 (ADR-0056 decision 1): ServeDir
# serves the console bundle from the gateway's own origin, and the response
# headers around it carry the Content-Security-Policy that makes decision 8's
# "no third-party fetch" an enforcement rather than a claim.
tower-http = { version = "0.7", default-features = false, features = [
    "trace",
    "fs",
    "set-header",
] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# The OpenAPI document, derived from the gateway's own request and response
# types (CPR-4, ADR-0071 decision 7). Derived rather than hand-authored so the
# contract cannot drift from the handlers that serve it — which is the whole
# content of "the OpenAPI contract is authoritative". MIT/Apache-2.0.
# Gateway-only, like the Prometheus recorder and the OTel SDK: no crate below
# the gateway knows this exists.
utoipa = { version = "5", default-features = false, features = ["chrono", "macros"] }
uuid = { version = "1", features = ["serde", "v7"] }
# Hostile OKF archive inputs are unpacked inside the leaf adapter under strict
# entry/count/size/path bounds. These crates parse inert bytes only; the
# gateway never executes an imported artifact (CPR-27, ADR-0087).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Wipes key material and opened plaintext on drop (TEN-4, ADR-0064
# decision 11). MIT/Apache-2.0.
zeroize = { version = "1", features = ["derive"] }

# Test-only dependencies.
http-body-util = "0.1"
proptest = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
