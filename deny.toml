# Licence and supply-chain policy for the core path (CLAUDE.md: MIT/Apache-2.0/PostgreSQL
# only). Any addition to the allow list is a reviewed diff with justification.

[licenses]
version = 2
# Unicode-3.0 (OSI-approved, permissive) is required by unicode-ident, which every
# proc-macro dependency (serde_derive, thiserror-impl) pulls in transitively. It
# covers Unicode character data tables only. Added with FND-3.
allow = ["MIT", "Apache-2.0", "PostgreSQL", "Unicode-3.0"]
# Narrow per-crate exceptions instead of widening the global allowlist. Both
# are unavoidable transitive deps of sqlx (tech plan §1.3) with permissive,
# OSI-approved licences. Added with FND-4.
exceptions = [
    # hashbrown's default hasher, via sqlx-core.
    { name = "foldhash", allow = ["Zlib"] },
    # axum's URL router, "MIT AND BSD-3-Clause" (route-matching code derived
    # from httprouter). MIT half is globally allowed. Added with FND-5.
    { name = "matchit", allow = ["BSD-3-Clause"] },
    # Constant-time crypto primitive used by Postgres SCRAM auth, via sqlx-postgres.
    { name = "subtle", allow = ["BSD-3-Clause"] },
]
# Our own crates are publish = false and carry no licence field; the allowlist
# governs dependencies, not first-party code.
private = { ignore = true }

[advisories]
version = 2

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path deps inside the workspace are intentionally versionless.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
