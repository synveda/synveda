# Licence and supply-chain policy for the core path (CLAUDE.md: MIT/Apache-2.0/PostgreSQL
# only). Any addition to the allow list is a reviewed diff with justification.

[licenses]
version = 2
# Unicode-3.0 (OSI-approved, permissive) is required by unicode-ident, which every
# proc-macro dependency (serde_derive, thiserror-impl) pulls in transitively. It
# covers Unicode character data tables only. Added with FND-3.
allow = ["MIT", "Apache-2.0", "PostgreSQL", "Unicode-3.0"]
# Narrow per-crate exceptions instead of widening the global allowlist. Both
# are unavoidable transitive deps of sqlx (tech plan §1.3) with permissive,
# OSI-approved licences. Added with FND-4.
exceptions = [
    # hashbrown's default hasher, via sqlx-core.
    { name = "foldhash", allow = ["Zlib"] },
    # axum's URL router, "MIT AND BSD-3-Clause" (route-matching code derived
    # from httprouter). MIT half is globally allowed. Added with FND-5.
    { name = "matchit", allow = ["BSD-3-Clause"] },
    # Constant-time crypto primitive used by Postgres SCRAM auth, via sqlx-postgres.
    { name = "subtle", allow = ["BSD-3-Clause"] },
    # jsonwebtoken's rust_crypto backend (AUTH-1, ADR-0010) — chosen exactly
    # because the alternatives (ring, aws-lc) are licence-inadmissible. The
    # dalek crates arrive via the backend umbrella feature (EdDSA support we
    # do not yet verify with); simple_asn1 parses PEM in tests. All three are
    # OSI-approved permissive. Added with AUTH-1.
    { name = "curve25519-dalek", allow = ["BSD-3-Clause"] },
    { name = "ed25519-dalek", allow = ["BSD-3-Clause"] },
    { name = "simple_asn1", allow = ["ISC"] },
    # Build-time-only dep of psm/stacker (segmented stacks for Cedar's
    # recursive-descent parser), via cedar-policy-core (AUTHZ-1, ADR-0012).
    # The LLVM exception only *relaxes* Apache-2.0's binary-attribution
    # requirement; nothing from this crate ships in our binaries at all.
    # Added with AUTHZ-1.
    { name = "ar_archive_writer", allow = ["Apache-2.0 WITH LLVM-exception"] },
]
# Our own crates are publish = false and carry no licence field; the allowlist
# governs dependencies, not first-party code.
private = { ignore = true }

[advisories]
version = 2
ignore = [
    # Marvin attack: timing side channel in RSA *private-key* operations.
    # Synveda holds no RSA private keys — the rsa crate (via jsonwebtoken,
    # AUTH-1/ADR-0010) performs public-key signature verification only, and
    # the advisory's workaround ("avoid settings where attackers observe
    # timing of private-key ops") is structurally satisfied. No patched
    # release exists yet; revisit when RustCrypto ships the constant-time
    # rewrite.
    "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path deps inside the workspace are intentionally versionless.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
