# CPR-45 / ADR-0102: provider-neutral single-host deployment graph.
#
# This file intentionally defines neither PostgreSQL nor an OIDC provider.
# Select exactly one runtime overlay and the required provider fragments through
# deploy/compose/scripts/compose.sh. Database, tenant, realm and issuer
# convergence are explicit graph phases before the long-running processes.

x-synveda-product: &synveda-product
  image: ${SYNVEDA_PRODUCT_IMAGE:?set SYNVEDA_PRODUCT_IMAGE}
  user: "${SYNVEDA_RUNTIME_UID:?set SYNVEDA_RUNTIME_UID}:${SYNVEDA_RUNTIME_GID:?set SYNVEDA_RUNTIME_GID}"
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=64m

x-synveda-long-running: &synveda-long-running
  restart: ${SYNVEDA_COMPOSE_RESTART_POLICY:?set SYNVEDA_COMPOSE_RESTART_POLICY}

services:
  proxy:
    image: ${SYNVEDA_CADDY_IMAGE:?set SYNVEDA_CADDY_IMAGE}
    labels:
      com.synveda.contract: cpr-45
    user: "${SYNVEDA_RUNTIME_UID}:${SYNVEDA_RUNTIME_GID}"
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    restart: ${SYNVEDA_COMPOSE_RESTART_POLICY}
    stop_grace_period: 15s
    environment:
      SYNVEDA_APP_HOST: ${SYNVEDA_APP_HOST:?set SYNVEDA_APP_HOST}
      SYNVEDA_PUBLIC_PORT: ${SYNVEDA_PUBLIC_PORT:?set SYNVEDA_PUBLIC_PORT}
      SYNVEDA_PROXY_HTTP_PORT: ${SYNVEDA_PROXY_HTTP_PORT:?set SYNVEDA_PROXY_HTTP_PORT}
      SYNVEDA_PROXY_HTTPS_PORT: ${SYNVEDA_PROXY_HTTPS_PORT:?set SYNVEDA_PROXY_HTTPS_PORT}
      XDG_CONFIG_HOME: /tmp/caddy-config
      XDG_DATA_HOME: /tmp/caddy-data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=64m
    volumes:
      - type: bind
        source: ./configs/caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ${SYNVEDA_CADDY_APP_CONFIG:?set SYNVEDA_CADDY_APP_CONFIG}
        target: /etc/caddy/app.caddy
        read_only: true
      - type: bind
        source: ${SYNVEDA_CADDY_IDENTITY_CONFIG:?set SYNVEDA_CADDY_IDENTITY_CONFIG}
        target: /etc/caddy/identity.caddy
        read_only: true
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 10s
      timeout: 6s
      retries: 6
    networks:
      public-edge:
        gw_priority: 1
      app-backend: {}

  database-preflight:
    <<: *synveda-product
    labels:
      com.synveda.contract: cpr-45
    command: ["database-preflight"]
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    environment:
      SYNVEDA_MIGRATOR_DATABASE_URL_FILE: /run/secrets/synveda_migrator_database_url
      SYNVEDA_GATEWAY_DATABASE_URL_FILE: /run/secrets/synveda_gateway_database_url
      SYNVEDA_WORKER_DATABASE_URL_FILE: /run/secrets/synveda_worker_database_url
      SYNVEDA_DATABASE_ROLES_FILE: /etc/synveda/database/roles.json
      RUST_LOG: ${RUST_LOG:-info}
    secrets:
      - source: synveda_migrator_database_url
        target: synveda_migrator_database_url
      - source: synveda_gateway_database_url
        target: synveda_gateway_database_url
      - source: synveda_worker_database_url
        target: synveda_worker_database_url
    volumes:
      - type: bind
        source: ${SYNVEDA_DATABASE_ROLES_FILE:?set SYNVEDA_DATABASE_ROLES_FILE}
        target: /etc/synveda/database/roles.json
        read_only: true
    networks:
      synveda-data: {}

  migrate:
    <<: *synveda-product
    labels:
      com.synveda.contract: cpr-45
    command: ["migrate"]
    restart: "no"
    depends_on:
      database-preflight:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      SYNVEDA_DATABASE_ROLES_FILE: /etc/synveda/database/roles.json
      RUST_LOG: ${RUST_LOG:-info}
    secrets:
      - source: synveda_migrator_database_url
        target: database_url
    volumes:
      - type: bind
        source: ${SYNVEDA_DATABASE_ROLES_FILE}
        target: /etc/synveda/database/roles.json
        read_only: true
    networks:
      synveda-data: {}

  tenant-convergence:
    <<: *synveda-product
    labels:
      com.synveda.contract: cpr-45
    command: ["tenant-converge"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      SYNVEDA_DATABASE_ROLES_FILE: /etc/synveda/database/roles.json
      SYNVEDA_BOOTSTRAP_TENANT_ID: ${SYNVEDA_BOOTSTRAP_TENANT_ID:?set SYNVEDA_BOOTSTRAP_TENANT_ID}
      SYNVEDA_BOOTSTRAP_TENANT_SLUG: ${SYNVEDA_BOOTSTRAP_TENANT_SLUG:?set SYNVEDA_BOOTSTRAP_TENANT_SLUG}
      SYNVEDA_BOOTSTRAP_TENANT_NAME: ${SYNVEDA_BOOTSTRAP_TENANT_NAME:?set SYNVEDA_BOOTSTRAP_TENANT_NAME}
      SYNVEDA_KMS_KEY_FILE: /run/secrets/kms_key
      SYNVEDA_KMS_KEY_REF_FILE: /run/secrets/kms_key_ref
      RUST_LOG: ${RUST_LOG:-info}
    secrets:
      - source: synveda_migrator_database_url
        target: database_url
      - source: synveda_kms_key
        target: kms_key
      - source: synveda_kms_key_ref
        target: kms_key_ref
    volumes:
      - type: bind
        source: ${SYNVEDA_DATABASE_ROLES_FILE}
        target: /etc/synveda/database/roles.json
        read_only: true
    networks:
      synveda-data: {}

  issuer-diagnostic:
    <<: *synveda-product
    labels:
      com.synveda.contract: cpr-45
    command: ["issuer-diagnostic"]
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      SYNVEDA_OIDC_ISSUERS_FILE: /etc/synveda/oidc/issuers.json
      SYNVEDA_OIDC_EXPECTED_ISSUER: ${SYNVEDA_OIDC_ISSUER:?set SYNVEDA_OIDC_ISSUER}
      SYNVEDA_PUBLIC_URL: ${SYNVEDA_PUBLIC_APP_URL:?set SYNVEDA_PUBLIC_APP_URL}
      SYNVEDA_INSECURE_DEVELOPMENT_HTTP: ${SYNVEDA_INSECURE_DEVELOPMENT_HTTP:?set SYNVEDA_INSECURE_DEVELOPMENT_HTTP}
      SYNVEDA_BOOTSTRAP_TENANT_ID: ${SYNVEDA_BOOTSTRAP_TENANT_ID:?set SYNVEDA_BOOTSTRAP_TENANT_ID}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - type: bind
        source: ${SYNVEDA_OIDC_ISSUERS_FILE:?set SYNVEDA_OIDC_ISSUERS_FILE}
        target: /etc/synveda/oidc/issuers.json
        read_only: true
    networks:
      app-backend: {}
      application-egress:
        gw_priority: 1

  gateway:
    <<: [*synveda-product, *synveda-long-running]
    labels:
      com.synveda.contract: cpr-45
    command: ["gateway"]
    stop_grace_period: 30s
    depends_on:
      tenant-convergence:
        condition: service_completed_successfully
      issuer-diagnostic:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      SYNVEDA_DATABASE_ROLES_FILE: /etc/synveda/database/roles.json
      SYNVEDA_LISTEN_ADDR: 0.0.0.0:8120
      SYNVEDA_PUBLIC_URL: ${SYNVEDA_PUBLIC_APP_URL:?set SYNVEDA_PUBLIC_APP_URL}
      SYNVEDA_OIDC_ISSUERS_FILE: /etc/synveda/oidc/issuers.json
      SYNVEDA_INSECURE_DEVELOPMENT_HTTP: ${SYNVEDA_INSECURE_DEVELOPMENT_HTTP:?set SYNVEDA_INSECURE_DEVELOPMENT_HTTP}
      SYNVEDA_KMS_KEY_FILE: /run/secrets/kms_key
      SYNVEDA_KMS_KEY_REF_FILE: /run/secrets/kms_key_ref
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      RUST_LOG: ${RUST_LOG:-info}
    secrets:
      - source: synveda_gateway_database_url
        target: database_url
      - source: synveda_kms_key
        target: kms_key
      - source: synveda_kms_key_ref
        target: kms_key_ref
    volumes:
      - type: bind
        source: ${SYNVEDA_DATABASE_ROLES_FILE}
        target: /etc/synveda/database/roles.json
        read_only: true
      - type: bind
        source: ${SYNVEDA_OIDC_ISSUERS_FILE:?set SYNVEDA_OIDC_ISSUERS_FILE}
        target: /etc/synveda/oidc/issuers.json
        read_only: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/synveda-container", "probe", "gateway", "ready"]
      interval: 5s
      timeout: 3s
      retries: 24
    networks:
      app-backend: {}
      synveda-data: {}
      telemetry: {}
      application-egress:
        gw_priority: 1

  worker:
    <<: [*synveda-product, *synveda-long-running]
    labels:
      com.synveda.contract: cpr-45
    command: ["worker"]
    stop_grace_period: 85s
    depends_on:
      tenant-convergence:
        condition: service_completed_successfully
      issuer-diagnostic:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      SYNVEDA_DATABASE_ROLES_FILE: /etc/synveda/database/roles.json
      SYNVEDA_WORKER_LISTEN_ADDR: 127.0.0.1:8121
      SYNVEDA_OIDC_ISSUERS_FILE: /etc/synveda/oidc/issuers.json
      SYNVEDA_KMS_KEY_FILE: /run/secrets/kms_key
      SYNVEDA_KMS_KEY_REF_FILE: /run/secrets/kms_key_ref
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      RUST_LOG: ${RUST_LOG:-info}
    secrets:
      - source: synveda_worker_database_url
        target: database_url
      - source: synveda_kms_key
        target: kms_key
      - source: synveda_kms_key_ref
        target: kms_key_ref
    volumes:
      - type: bind
        source: ${SYNVEDA_DATABASE_ROLES_FILE}
        target: /etc/synveda/database/roles.json
        read_only: true
      - type: bind
        source: ${SYNVEDA_OIDC_ISSUERS_FILE}
        target: /etc/synveda/oidc/issuers.json
        read_only: true
      - type: bind
        source: ${SYNVEDA_OIDC_DIRECTORY_SECRETS_DIR:?set SYNVEDA_OIDC_DIRECTORY_SECRETS_DIR}
        target: /run/secrets/oidc_directory
        read_only: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/synveda-container", "probe", "worker", "ready"]
      interval: 5s
      timeout: 3s
      retries: 24
    networks:
      synveda-data: {}
      telemetry: {}
      application-egress:
        gw_priority: 1

  otel-collector:
    image: ${SYNVEDA_OTEL_COLLECTOR_IMAGE:?set SYNVEDA_OTEL_COLLECTOR_IMAGE}
    labels:
      com.synveda.contract: cpr-45
    user: "${SYNVEDA_RUNTIME_UID}:${SYNVEDA_RUNTIME_GID}"
    command: ["--config=/etc/otelcol/config.yaml"]
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    restart: ${SYNVEDA_COMPOSE_RESTART_POLICY}
    stop_grace_period: 15s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=64m
    volumes:
      - type: bind
        source: ./configs/otel/collector.yaml
        target: /etc/otelcol/config.yaml
        read_only: true
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/config.yaml"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      telemetry: {}
      keycloak-management: {}
      telemetry-egress:
        gw_priority: 1

networks:
  public-edge:
    ipam:
      config:
        - subnet: ${SYNVEDA_RENDER_PUBLIC_EDGE_SUBNET:?set SYNVEDA_RENDER_PUBLIC_EDGE_SUBNET}
          gateway: ${SYNVEDA_RENDER_PUBLIC_EDGE_GATEWAY:?set SYNVEDA_RENDER_PUBLIC_EDGE_GATEWAY}
    labels:
      com.synveda.contract: cpr-45
      com.synveda.network: public-edge
  app-backend:
    internal: true
    ipam:
      config:
        - subnet: ${SYNVEDA_RENDER_APP_BACKEND_SUBNET:?set SYNVEDA_RENDER_APP_BACKEND_SUBNET}
          gateway: ${SYNVEDA_RENDER_APP_BACKEND_GATEWAY:?set SYNVEDA_RENDER_APP_BACKEND_GATEWAY}
    labels:
      com.synveda.contract: cpr-45
      com.synveda.network: app-backend
  synveda-data:
    internal: true
    ipam:
      config:
        - subnet: ${SYNVEDA_RENDER_DATA_SUBNET:?set SYNVEDA_RENDER_DATA_SUBNET}
          gateway: ${SYNVEDA_RENDER_DATA_GATEWAY:?set SYNVEDA_RENDER_DATA_GATEWAY}
    labels:
      com.synveda.contract: cpr-45
      com.synveda.network: synveda-data
  keycloak-data:
    internal: true
    ipam:
      config:
        - subnet: ${SYNVEDA_RENDER_KEYCLOAK_DATA_SUBNET:?set SYNVEDA_RENDER_KEYCLOAK_DATA_SUBNET}
          gateway: ${SYNVEDA_RENDER_KEYCLOAK_DATA_GATEWAY:?set SYNVEDA_RENDER_KEYCLOAK_DATA_GATEWAY}
    labels:
      com.synveda.contract: cpr-45
      com.synveda.network: keycloak-data
  identity-backend:
    internal: true
    ipam:
      config:
        - subnet: ${SYNVEDA_RENDER_IDENTITY_SUBNET:?set SYNVEDA_RENDER_IDENTITY_SUBNET}
          gateway: ${SYNVEDA_RENDER_IDENTITY_GATEWAY:?set SYNVEDA_RENDER_IDENTITY_GATEWAY}
          ip_range: ${SYNVEDA_RENDER_IDENTITY_DYNAMIC_RANGE:?set SYNVEDA_RENDER_IDENTITY_DYNAMIC_RANGE}
    labels:
      com.synveda.contract: cpr-45
      com.synveda.network: identity-backend
  keycloak-management:
    internal: true
    ipam:
      config:
        - subnet: ${SYNVEDA_RENDER_KEYCLOAK_MANAGEMENT_SUBNET:?set SYNVEDA_RENDER_KEYCLOAK_MANAGEMENT_SUBNET}
          gateway: ${SYNVEDA_RENDER_KEYCLOAK_MANAGEMENT_GATEWAY:?set SYNVEDA_RENDER_KEYCLOAK_MANAGEMENT_GATEWAY}
    labels:
      com.synveda.contract: cpr-45
      com.synveda.network: keycloak-management
  telemetry:
    internal: true
    ipam:
      config:
        - subnet: ${SYNVEDA_RENDER_TELEMETRY_SUBNET:?set SYNVEDA_RENDER_TELEMETRY_SUBNET}
          gateway: ${SYNVEDA_RENDER_TELEMETRY_GATEWAY:?set SYNVEDA_RENDER_TELEMETRY_GATEWAY}
    labels:
      com.synveda.contract: cpr-45
      com.synveda.network: telemetry
  application-egress:
    ipam:
      config:
        - subnet: ${SYNVEDA_RENDER_APPLICATION_EGRESS_SUBNET:?set SYNVEDA_RENDER_APPLICATION_EGRESS_SUBNET}
          gateway: ${SYNVEDA_RENDER_APPLICATION_EGRESS_GATEWAY:?set SYNVEDA_RENDER_APPLICATION_EGRESS_GATEWAY}
    labels:
      com.synveda.contract: cpr-45
      com.synveda.network: application-egress
  identity-egress:
    ipam:
      config:
        - subnet: ${SYNVEDA_RENDER_IDENTITY_EGRESS_SUBNET:?set SYNVEDA_RENDER_IDENTITY_EGRESS_SUBNET}
          gateway: ${SYNVEDA_RENDER_IDENTITY_EGRESS_GATEWAY:?set SYNVEDA_RENDER_IDENTITY_EGRESS_GATEWAY}
    labels:
      com.synveda.contract: cpr-45
      com.synveda.network: identity-egress
  telemetry-egress:
    ipam:
      config:
        - subnet: ${SYNVEDA_RENDER_TELEMETRY_EGRESS_SUBNET:?set SYNVEDA_RENDER_TELEMETRY_EGRESS_SUBNET}
          gateway: ${SYNVEDA_RENDER_TELEMETRY_EGRESS_GATEWAY:?set SYNVEDA_RENDER_TELEMETRY_EGRESS_GATEWAY}
    labels:
      com.synveda.contract: cpr-45
      com.synveda.network: telemetry-egress

secrets:
  synveda_migrator_database_url:
    file: ${SYNVEDA_SECRETS_DIR:?set SYNVEDA_SECRETS_DIR}/synveda_migrator_database_url
  synveda_gateway_database_url:
    file: ${SYNVEDA_SECRETS_DIR}/synveda_gateway_database_url
  synveda_worker_database_url:
    file: ${SYNVEDA_SECRETS_DIR}/synveda_worker_database_url
  synveda_kms_key:
    file: ${SYNVEDA_SECRETS_DIR}/synveda_kms_key
  synveda_kms_key_ref:
    file: ${SYNVEDA_SECRETS_DIR}/synveda_kms_key_ref
