name: synveda-reference

services:
  proxy:
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "80"
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    secrets:
      - source: synveda_tls_cert
        target: tls_cert
      - source: synveda_tls_key
        target: tls_key
    mem_limit: 256m
    cpus: 1.0
  migrate:
    mem_limit: 512m
    cpus: 1.0
  gateway:
    mem_limit: 1g
    cpus: 2.0
  worker:
    mem_limit: 2g
    cpus: 2.0
  otel-collector:
    mem_limit: 512m
    cpus: 1.0

secrets:
  synveda_tls_cert:
    file: ${SYNVEDA_SECRETS_DIR}/tls_cert
  synveda_tls_key:
    file: ${SYNVEDA_SECRETS_DIR}/tls_key
