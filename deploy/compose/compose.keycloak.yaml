services:
  database-preflight:
    environment:
      SYNVEDA_DATABASE_REQUIRED_PEER: keycloak
      SYNVEDA_DATABASE_PEER_WITNESS_FILE: /run/synveda/database-authority/keycloak-cluster.json
    volumes:
      - type: bind
        source: ${SYNVEDA_DATABASE_AUTHORITY_DIR:?set SYNVEDA_DATABASE_AUTHORITY_DIR}
        target: /run/synveda/database-authority
        read_only: true
    depends_on:
      keycloak-database-bootstrap:
        condition: service_completed_successfully

  gateway:
    environment:
      SYNVEDA_DATABASE_REQUIRED_PEER: keycloak

  worker:
    environment:
      SYNVEDA_DATABASE_REQUIRED_PEER: keycloak

  issuer-diagnostic:
    depends_on:
      keycloak-realm-convergence:
        condition: service_healthy

  proxy:
    environment:
      SYNVEDA_AUTH_HOST: ${SYNVEDA_AUTH_HOST:?set SYNVEDA_AUTH_HOST}
    depends_on:
      keycloak-realm-convergence:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${SYNVEDA_KEYCLOAK_PUBLIC_GATE_DIR:?set SYNVEDA_KEYCLOAK_PUBLIC_GATE_DIR}
        target: /run/synveda/keycloak-public-gate
        read_only: true
    networks:
      app-backend:
        aliases:
          - ${SYNVEDA_AUTH_HOST:?set SYNVEDA_AUTH_HOST}
      identity-backend:
        ipv4_address: ${SYNVEDA_RENDER_PROXY_IDENTITY_ADDRESS:?set SYNVEDA_RENDER_PROXY_IDENTITY_ADDRESS}

  keycloak-database-bootstrap:
    image: ${SYNVEDA_POSTGRES_IMAGE:?set SYNVEDA_POSTGRES_IMAGE}
    labels:
      com.synveda.contract: cpr-45
    user: "${SYNVEDA_RUNTIME_UID:?set SYNVEDA_RUNTIME_UID}:${SYNVEDA_RUNTIME_GID:?set SYNVEDA_RUNTIME_GID}"
    entrypoint: ["/usr/local/bin/synveda-database-bootstrap"]
    command: ["keycloak"]
    environment:
      SYNVEDA_POSTGRES_BOOTSTRAP_URL: ${SYNVEDA_POSTGRES_BOOTSTRAP_URL:?set SYNVEDA_POSTGRES_BOOTSTRAP_URL}
      SYNVEDA_POSTGRES_BUNDLED_CLUSTER: ${SYNVEDA_POSTGRES_BUNDLED_CLUSTER:?set SYNVEDA_POSTGRES_BUNDLED_CLUSTER}
      SYNVEDA_DATABASE_ROLES_FILE: /run/secrets/database_roles.json
      SYNVEDA_DATABASE_AUTHORITY_DIR: /run/synveda/database-authority
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=16m
    secrets:
      - source: postgres_owner_password
        target: postgres_bootstrap_password
      - source: keycloak_database_password
        target: keycloak_database_password
    volumes:
      - type: bind
        source: ${SYNVEDA_DATABASE_ROLES_FILE:?set SYNVEDA_DATABASE_ROLES_FILE}
        target: /run/secrets/database_roles.json
        read_only: true
      - type: bind
        source: ${SYNVEDA_DATABASE_AUTHORITY_DIR:?set SYNVEDA_DATABASE_AUTHORITY_DIR}
        target: /run/synveda/database-authority
    networks:
      keycloak-data: {}

  keycloak:
    image: ${SYNVEDA_KEYCLOAK_IMAGE:?set SYNVEDA_KEYCLOAK_IMAGE}
    labels:
      com.synveda.contract: cpr-45
    user: "${SYNVEDA_RUNTIME_UID:?set SYNVEDA_RUNTIME_UID}:${SYNVEDA_RUNTIME_GID:?set SYNVEDA_RUNTIME_GID}"
    command: ["start", "--optimized"]
    environment:
      KC_DB: postgres
      KC_DB_URL: ${SYNVEDA_KEYCLOAK_DATABASE_URL:?set SYNVEDA_KEYCLOAK_DATABASE_URL}
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/secrets/keycloak_database_password
      KC_BOOTSTRAP_ADMIN_USERNAME_FILE: /run/secrets/keycloak_admin_username
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HOSTNAME: ${SYNVEDA_PUBLIC_AUTH_URL:?set SYNVEDA_PUBLIC_AUTH_URL}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${SYNVEDA_RENDER_PROXY_IDENTITY_ADDRESS}/32
      KC_CACHE: local
      # KC-SERVICES0077 otherwise logs the mounted bootstrap identifier.
      KC_LOG_LEVEL_ORG_KEYCLOAK_SERVICES: warn
      SYNVEDA_KEYCLOAK_PUBLIC_GATE_PATH: /run/synveda/keycloak-public-gate
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    restart: ${SYNVEDA_COMPOSE_RESTART_POLICY}
    stop_grace_period: 45s
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=128m
      - /opt/keycloak/data/tmp:rw,noexec,nosuid,nodev,mode=0700,size=128m,uid=${SYNVEDA_RUNTIME_UID},gid=${SYNVEDA_RUNTIME_GID}
    depends_on:
      keycloak-database-bootstrap:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${SYNVEDA_KEYCLOAK_PUBLIC_GATE_DIR:?set SYNVEDA_KEYCLOAK_PUBLIC_GATE_DIR}
        target: /run/synveda/keycloak-public-gate
    secrets:
      - source: keycloak_database_password
        target: keycloak_database_password
      - source: keycloak_admin_username
        target: keycloak_admin_username
      - source: keycloak_admin_password
        target: keycloak_admin_password
    healthcheck:
      test: ["CMD", "/opt/keycloak/bin/synveda-keycloak-health", "local"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s
    networks:
      identity-backend: {}
      keycloak-data: {}
      keycloak-management: {}

  keycloak-realm-convergence:
    image: ${SYNVEDA_KEYCLOAK_IMAGE:?set SYNVEDA_KEYCLOAK_IMAGE}
    labels:
      com.synveda.contract: cpr-45
    user: "${SYNVEDA_RUNTIME_UID:?set SYNVEDA_RUNTIME_UID}:${SYNVEDA_RUNTIME_GID:?set SYNVEDA_RUNTIME_GID}"
    command: ["synveda-realm-supervise"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME_FILE: /run/secrets/keycloak_admin_username
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      SYNVEDA_KEYCLOAK_CONVERGENCE_PASSWORD_FILE: /run/secrets/keycloak_convergence_admin_password
      SYNVEDA_PUBLIC_APP_URL: ${SYNVEDA_PUBLIC_APP_URL:?set SYNVEDA_PUBLIC_APP_URL}
      SYNVEDA_PUBLIC_AUTH_URL: ${SYNVEDA_PUBLIC_AUTH_URL:?set SYNVEDA_PUBLIC_AUTH_URL}
      SYNVEDA_KEYCLOAK_SSL_REQUIRED: ${SYNVEDA_KEYCLOAK_SSL_REQUIRED:?set SYNVEDA_KEYCLOAK_SSL_REQUIRED}
      SYNVEDA_KEYCLOAK_PUBLIC_GATE_PATH: /run/synveda/keycloak-public-gate
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    restart: ${SYNVEDA_COMPOSE_RESTART_POLICY:?set SYNVEDA_COMPOSE_RESTART_POLICY}
    # Bash can defer a trapped TERM for the 56-second proof child; the
    # fail-closed cleanup path is bounded at 110 seconds. Keep explicit margin
    # so Tini/Compose cannot SIGKILL before quarantine and session settlement.
    stop_grace_period: 210s
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700,size=64m,uid=${SYNVEDA_RUNTIME_UID},gid=${SYNVEDA_RUNTIME_GID}
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/keycloak/bin/synveda-generation-gate", "ready"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 15s
    secrets:
      - source: keycloak_admin_username
        target: keycloak_admin_username
      - source: keycloak_admin_password
        target: keycloak_admin_password
      - source: keycloak_convergence_admin_password
        target: keycloak_convergence_admin_password
    volumes:
      - type: bind
        source: ${SYNVEDA_KEYCLOAK_PUBLIC_GATE_DIR:?set SYNVEDA_KEYCLOAK_PUBLIC_GATE_DIR}
        target: /run/synveda/keycloak-public-gate
    networks:
      identity-backend: {}
      keycloak-management: {}

secrets:
  postgres_owner_password:
    file: ${SYNVEDA_SECRETS_DIR:?set SYNVEDA_SECRETS_DIR}/postgres_owner_password
  keycloak_database_password:
    file: ${SYNVEDA_SECRETS_DIR}/keycloak_database_password
  keycloak_admin_username:
    file: ${SYNVEDA_SECRETS_DIR}/keycloak_admin_username
  keycloak_admin_password:
    file: ${SYNVEDA_SECRETS_DIR}/keycloak_admin_password
  keycloak_convergence_admin_password:
    file: ${SYNVEDA_SECRETS_DIR}/keycloak_convergence_admin_password
