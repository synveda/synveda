x-synveda-browser-proxy-closure: &synveda-browser-proxy-closure
  HTTP_PROXY: ""
  http_proxy: ""
  HTTPS_PROXY: ""
  https_proxy: ""
  NO_PROXY: ""
  no_proxy: ""
  FTP_PROXY: ""
  ftp_proxy: ""
  ALL_PROXY: ""
  all_proxy: ""

services:
  browser-acceptance:
    profiles: [browser-acceptance]
    image: ${SYNVEDA_BROWSER_IMAGE:?set SYNVEDA_BROWSER_IMAGE}
    labels:
      com.synveda.contract: cpr-45
    user: "${SYNVEDA_RUNTIME_UID:?set SYNVEDA_RUNTIME_UID}:${SYNVEDA_RUNTIME_GID:?set SYNVEDA_RUNTIME_GID}"
    entrypoint: ["node", "console-login.mjs"]
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=${SYNVEDA_BROWSER_SECCOMP_PROFILE:?set SYNVEDA_BROWSER_SECCOMP_PROFILE}
    pids_limit: 256
    restart: "no"
    stop_grace_period: 10s
    shm_size: 256m
    mem_limit: 1g
    cpus: 1.0
    environment:
      <<: *synveda-browser-proxy-closure
      SYNVEDA_BROWSER_APP_URL: ${SYNVEDA_PUBLIC_APP_URL:?set SYNVEDA_PUBLIC_APP_URL}
      SYNVEDA_BROWSER_ISSUER: ${SYNVEDA_OIDC_ISSUER:?set SYNVEDA_OIDC_ISSUER}
      SYNVEDA_BOOTSTRAP_TENANT_ID: ${SYNVEDA_BOOTSTRAP_TENANT_ID:?set SYNVEDA_BOOTSTRAP_TENANT_ID}
      SYNVEDA_INSECURE_DEVELOPMENT_HTTP: ${SYNVEDA_INSECURE_DEVELOPMENT_HTTP:?set SYNVEDA_INSECURE_DEVELOPMENT_HTTP}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=256m
    volumes:
      - type: volume
        source: browser-acceptance-state
        target: /var/lib/synveda-browser
        volume:
          nocopy: false
    secrets:
      - source: keycloak_demo_admin_password
        target: keycloak_demo_admin_password
      - source: keycloak_demo_approver_password
        target: keycloak_demo_approver_password
      - source: keycloak_demo_member_password
        target: keycloak_demo_member_password
      - source: keycloak_demo_viewer_password
        target: keycloak_demo_viewer_password
    depends_on:
      gateway:
        condition: service_healthy
      keycloak-realm-convergence:
        condition: service_healthy
      proxy:
        condition: service_healthy
    networks:
      app-backend: {}

volumes:
  browser-acceptance-state:
    labels:
      com.synveda.contract: cpr-45
      com.synveda.volume: browser-acceptance-state
