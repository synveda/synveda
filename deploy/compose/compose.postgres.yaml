x-synveda-postgres-ambient-proxy-closure: &synveda-postgres-ambient-proxy-closure
  HTTP_PROXY: ""
  http_proxy: ""
  HTTPS_PROXY: ""
  https_proxy: ""
  NO_PROXY: ""
  no_proxy: ""
  FTP_PROXY: ""
  ftp_proxy: ""
  ALL_PROXY: ""
  all_proxy: ""

services:
  postgres:
    image: ${SYNVEDA_POSTGRES_IMAGE:?set SYNVEDA_POSTGRES_IMAGE}
    labels:
      com.synveda.contract: cpr-45
    environment:
      <<: *synveda-postgres-ambient-proxy-closure
      POSTGRES_USER: synveda_owner
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
    read_only: true
    init: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    restart: ${SYNVEDA_COMPOSE_RESTART_POLICY:?set SYNVEDA_COMPOSE_RESTART_POLICY}
    stop_grace_period: 60s
    shm_size: 256m
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,mode=3775,size=16m
    secrets:
      - source: postgres_owner_password
        target: postgres_owner_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synveda_owner -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 24
    networks:
      synveda-data: {}
      keycloak-data: {}

  database-bootstrap:
    image: ${SYNVEDA_POSTGRES_IMAGE}
    labels:
      com.synveda.contract: cpr-45
    user: "${SYNVEDA_RUNTIME_UID}:${SYNVEDA_RUNTIME_GID}"
    entrypoint: ["/usr/local/bin/synveda-database-bootstrap"]
    command: ["synveda"]
    environment:
      <<: *synveda-postgres-ambient-proxy-closure
      SYNVEDA_POSTGRES_BOOTSTRAP_URL: ${SYNVEDA_POSTGRES_BOOTSTRAP_URL:?set SYNVEDA_POSTGRES_BOOTSTRAP_URL}
      SYNVEDA_POSTGRES_BUNDLED_CLUSTER: "true"
      SYNVEDA_DATABASE_ROLES_FILE: /run/secrets/database_roles.json
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=16m
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - source: postgres_owner_password
        target: postgres_bootstrap_password
      - source: synveda_migrator_password
        target: synveda_migrator_password
      - source: synveda_gateway_password
        target: synveda_gateway_password
      - source: synveda_worker_password
        target: synveda_worker_password
    volumes:
      - type: bind
        source: ${SYNVEDA_DATABASE_ROLES_FILE:?set SYNVEDA_DATABASE_ROLES_FILE}
        target: /run/secrets/database_roles.json
        read_only: true
    networks:
      synveda-data: {}

  database-preflight:
    environment:
      SYNVEDA_DATABASE_EXPECTED_HOST: ${SYNVEDA_DATABASE_EXPECTED_HOST:?set SYNVEDA_DATABASE_EXPECTED_HOST}
      SYNVEDA_DATABASE_EXPECTED_PORT: ${SYNVEDA_DATABASE_EXPECTED_PORT:?set SYNVEDA_DATABASE_EXPECTED_PORT}
      SYNVEDA_DATABASE_EXPECTED_NAME: ${SYNVEDA_DATABASE_EXPECTED_NAME:?set SYNVEDA_DATABASE_EXPECTED_NAME}
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully

volumes:
  postgres-data:
    labels:
      com.synveda.contract: cpr-45
      com.synveda.volume: postgres-data

secrets:
  postgres_owner_password:
    file: ${SYNVEDA_SECRETS_DIR:?set SYNVEDA_SECRETS_DIR}/postgres_owner_password
  synveda_migrator_password:
    file: ${SYNVEDA_SECRETS_DIR}/synveda_migrator_password
  synveda_gateway_password:
    file: ${SYNVEDA_SECRETS_DIR}/synveda_gateway_password
  synveda_worker_password:
    file: ${SYNVEDA_SECRETS_DIR}/synveda_worker_password
