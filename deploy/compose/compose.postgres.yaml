services:
  postgres:
    image: ${SYNVEDA_POSTGRES_IMAGE:?set SYNVEDA_POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: synveda_owner
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
    read_only: true
    init: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    restart: ${SYNVEDA_COMPOSE_RESTART_POLICY:?set SYNVEDA_COMPOSE_RESTART_POLICY}
    stop_grace_period: 60s
    shm_size: 256m
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,mode=3775,size=16m
    secrets:
      - source: postgres_owner_password
        target: postgres_owner_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synveda_owner -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 24
    networks:
      synveda-data: {}
      keycloak-data: {}

volumes:
  postgres-data:
    labels:
      com.synveda.contract: cpr-45
      com.synveda.volume: postgres-data

secrets:
  postgres_owner_password:
    file: ${SYNVEDA_SECRETS_DIR:?set SYNVEDA_SECRETS_DIR}/postgres_owner_password
