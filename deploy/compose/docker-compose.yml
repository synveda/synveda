# Synveda contributor environment (FND-2; CPR-36, ADR-0095):
# Postgres 17 (+pgvector), Rauthy (OIDC), Temporal, TEI (BGE-M3), Jaeger.
# Dev-only credentials throughout; never reuse them outside local compose.
# The deployed gateway is the same context-platform binary and contract as the
# release and Helm forms; personal/team/enterprise behaviour is governed
# Configuration data, never a Compose profile or environment branch.
#
# Lifecycle: `make dev-up` / `make dev-down` (state survives; wipe with `down -v`).
name: synveda

services:
  postgres:
    build: ./postgres
    image: synveda/dev-postgres:17
    environment:
      POSTGRES_USER: synveda
      POSTGRES_PASSWORD: synveda-dev
      POSTGRES_DB: synveda
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synveda -d synveda"]
      interval: 5s
      timeout: 5s
      retries: 24

  rauthy:
    # Bundled OIDC provider for dev/SMB mode (tech plan §1.2). Config lives in
    # rauthy/config.toml — 0.29+ requires the basics in a file, not env vars.
    image: ghcr.io/sebadob/rauthy:0.35.2
    ports:
      - "8100:8080"
    volumes:
      - ./rauthy/config.toml:/app/config.toml:ro
      - rauthy-data:/app/data

  temporal:
    # auto-setup provisions the temporal + temporal_visibility databases in
    # the postgres service on first boot (DB=postgres12 is Temporal's name
    # for the postgres12+ driver).
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: synveda
      POSTGRES_PWD: synveda-dev
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro

  temporal-admin-tools:
    # Sidecar with the `temporal` CLI; the smoke test uses it for cluster
    # health, and it doubles as a dev shell (docker compose exec).
    image: temporalio/admin-tools:1.29.7-tctl-1.18.4-cli-1.7.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    stdin_open: true
    tty: true

  tei:
    # text-embeddings-inference serving BGE-M3 (tech plan §1.3). First start
    # downloads the model (~2.3 GB) into the tei-cache volume.
    # max-batch-tokens is capped: the default (16384, with 8192-token
    # sequences) OOM-kills warmup on a 16 GB Docker VM.
    #
    # The image is per-architecture, because upstream publishes two builds
    # and only one of them is versioned:
    #
    #   amd64  cpu-1.8.1                 a release tag
    #   arm64  cpu-arm64-sha-4150561     a main-branch build (TEI 1.9.3);
    #                                    there are no versioned arm64 tags,
    #                                    so this is pinned by commit rather
    #                                    than left on `cpu-arm64-latest`
    #
    # The two are a drop-in for each other where it counts: the same model
    # at the same dimension, and vectors that agree to float32 rounding
    # (cosine 1.000000000, max |diff| 7e-8 over the same inputs, measured
    # 2026-07-26). That is the property that matters — Knowledge revision
    # vectors retain model and dimension, and a corpus embedded on one
    # architecture has to stay comparable to one embedded on the other.
    #
    # `make dev-up` sets SYNVEDA_TEI_IMAGE from `uname -m`; the default here
    # is the amd64 release, which is what CI runs.
    image: ${SYNVEDA_TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.1}
    command:
      ["--model-id", "BAAI/bge-m3", "--max-batch-tokens", "4096", "--auto-truncate"]
    ports:
      - "8110:80"
    volumes:
      - tei-cache:/data
    # Without this, `up --wait tei` returns the moment the container is
    # *started* — Docker calls a container with no healthcheck healthy —
    # and on a cold `tei-cache` that is ~2.3 GB of model download before it
    # will answer anything. `make eval-retrieval` believed that wait.
    #
    # It is *not* why the 2026-08-01 nightly committed zero records across
    # every corpus. That run gave TEI 4m14s before it seeded and a cold
    # load measures 2m01s, so the embedder was there; the failure did not
    # reproduce on the same commit and remains unexplained. This is fixed
    # because a wait that waits for nothing is wrong on its own terms.
    #
    # `/health` answers once the model is loaded, which is exactly what
    # scripts/smoke.sh has always waited on. 180 × 10s is the same 1800s
    # budget that file allows a first start, written as retries because
    # `start_period` semantics have varied across Compose versions and this
    # number should not.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 180

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  gateway:
    # The product itself (OPS-1; CPR-36, ADR-0095). Not started by
    # `make dev-up`, which is the
    # contributor's loop and runs the gateway from `cargo run`; this is what
    # an installed deployment runs, and `synveda init` brings it up.
    profiles: ["deployed"]
    build:
      context: ../..
      dockerfile: deploy/compose/gateway/Dockerfile
    image: synveda/gateway:dev
    depends_on:
      postgres:
        condition: service_healthy
    # Written by `synveda init`: the issuer, the tenant it resolves to, and
    # the embedder chosen at install time. Absent, the gateway starts with
    # no issuer configured and refuses every request — which is the correct
    # failure for an uninitialised deployment, not a reason to default one.
    env_file:
      - path: .env
        required: false
    environment:
      # `synveda init` converges this LOGIN as a non-superuser,
      # non-BYPASSRLS member of the migrations' NOLOGIN `synveda_app` role.
      # The database owner remains bootstrap-only and never reaches the
      # gateway process. An explicit deployment DSN can replace the local one.
      DATABASE_URL: ${SYNVEDA_GATEWAY_DATABASE_URL:-postgres://synveda_gateway:synveda-dev@postgres:5432/synveda}
      # gRPC, not HTTP: telemetry.rs builds the exporter `.with_tonic()`.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8120:8120"
volumes:
  pg-data:
  rauthy-data:
  tei-cache:
