# CPR-45: release evaluation uses the canonical services and prebuilt images.
# One public loopback origin; the private Keycloak backchannel preserves issuer.
services:
  proxy:
    ports:
      - target: ${SYNVEDA_PUBLIC_PORT}
        published: ${SYNVEDA_PUBLIC_PORT}
        host_ip: 127.0.0.1
        protocol: tcp
  keycloak:
    environment:
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
  keycloak-realm-convergence:
    # First-run identity reconciliation performs bounded credential/authority
    # proofs. Keep health in "starting" through the launcher's 900s limit on
    # CPU-constrained hosts; readiness still requires the complete generation gate.
    healthcheck:
      start_period: 15m
  issuer-diagnostic:
    networks:
      identity-backend: {}
  gateway:
    networks:
      identity-backend: {}
  worker:
    networks:
      identity-backend: {}
