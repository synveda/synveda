x-synveda-pitr-proxy-build-closure: &synveda-pitr-proxy-build-closure
  HTTP_PROXY: ""
  http_proxy: ""
  HTTPS_PROXY: ""
  https_proxy: ""
  NO_PROXY: ""
  no_proxy: ""
  FTP_PROXY: ""
  ftp_proxy: ""
  ALL_PROXY: ""
  all_proxy: ""

# Both bootstrap services build the one PostgreSQL image tag; each must select
# the same target or the last build to finish replaces the pgBackRest image.
services:
  database-bootstrap:
    build:
      context: ../..
      dockerfile: deploy/compose/postgres/Dockerfile
      target: pitr
      args:
        <<: *synveda-pitr-proxy-build-closure

  keycloak-database-bootstrap:
    build:
      context: ../..
      dockerfile: deploy/compose/postgres/Dockerfile
      target: pitr
      args:
        <<: *synveda-pitr-proxy-build-closure
