# Portable tenant archive export and import (ADR-0157). The archive runs as a
# configured database administrator that bypasses row security; the operator
# supplies that URL as a private file, and only this one-shot receives it.
# Archives are written to and read from one private host directory.
x-synveda-tenant-archive-proxy-closure: &synveda-tenant-archive-proxy-closure
  HTTP_PROXY: ""
  http_proxy: ""
  HTTPS_PROXY: ""
  https_proxy: ""
  NO_PROXY: ""
  no_proxy: ""
  FTP_PROXY: ""
  ftp_proxy: ""
  ALL_PROXY: ""
  all_proxy: ""

services:
  tenant-archive:
    profiles: [lifecycle]
    image: ${SYNVEDA_PRODUCT_IMAGE:?set SYNVEDA_PRODUCT_IMAGE}
    labels:
      com.synveda.contract: cpr-45
    user: "${SYNVEDA_RUNTIME_UID:?set SYNVEDA_RUNTIME_UID}:${SYNVEDA_RUNTIME_GID:?set SYNVEDA_RUNTIME_GID}"
    entrypoint: ["/usr/local/bin/synveda"]
    command: ["tenant", "archive", "--help"]
    environment:
      <<: *synveda-tenant-archive-proxy-closure
      DATABASE_URL_FILE: /run/secrets/database_url
      SYNVEDA_DATABASE_ROLES_FILE: /etc/synveda/database/roles.json
      SYNVEDA_KMS_KEY_FILE: /run/secrets/kms_key
      SYNVEDA_KMS_KEY_REF_FILE: /run/secrets/kms_key_ref
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    restart: "no"
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700,size=16m,uid=${SYNVEDA_RUNTIME_UID},gid=${SYNVEDA_RUNTIME_GID}
    secrets:
      - source: tenant_archive_database_url
        target: database_url
      - source: synveda_kms_key
        target: kms_key
      - source: synveda_kms_key_ref
        target: kms_key_ref
    volumes:
      - type: bind
        source: ${SYNVEDA_DATABASE_ROLES_FILE:?set SYNVEDA_DATABASE_ROLES_FILE}
        target: /etc/synveda/database/roles.json
        read_only: true
      - type: bind
        source: ${SYNVEDA_TENANT_ARCHIVE_DIR:?set SYNVEDA_TENANT_ARCHIVE_DIR}
        target: /var/lib/synveda/archives
    networks:
      synveda-data: {}

secrets:
  tenant_archive_database_url:
    file: ${SYNVEDA_TENANT_ARCHIVE_DATABASE_URL_FILE:?set SYNVEDA_TENANT_ARCHIVE_DATABASE_URL_FILE}
