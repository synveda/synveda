apiVersion: v2
name: synveda
description: |
  Synveda's context-platform runtime — separate gateway and core worker
  processes from one image, external PostgreSQL or optional CloudNativePG, and a
  customer's IdP. Product profiles are governed Configuration data, not chart
  variants. CPR-45; ADR-0102.
type: application

# The chart's own version, and the product release it deploys. appVersion
# tracks the workspace version in Cargo.toml; the image tag defaults to it,
# so `helm upgrade` without an explicit tag deploys what the chart says it
# deploys.
version: 0.2.0
appVersion: "0.2.0"

kubeVersion: ">=1.29.0-0"

home: https://github.com/synveda/synveda
sources:
  - https://github.com/synveda/synveda

# CloudNativePG remains a separately installed operator (ADR-0062).
# The optional identity workload is an unchanged, locked upstream chart.
dependencies:
  - name: keycloakx
    alias: keycloak
    version: 7.3.2
    repository: https://codecentric.github.io/helm-charts
    condition: keycloak.enabled
annotations:
  synveda.io/optional-operator: "cloudnative-pg (postgres.mode=cnpg only)"
