# Synveda Kubernetes deployment (OPS-2; CPR-36, ADR-0095).
#
# This chart sizes infrastructure and connects external services. It never
# selects personal, team or enterprise product behaviour: those are immutable
# governed Configuration versions and scope bindings in the one runtime.
#
# See README.md for external installation, Secret file formats and acceptance.
# External dependencies are the default; all endpoints and Secrets are explicit.

# ── The product image ────────────────────────────────────────────────────
# Carries the gateway, core worker and `synveda` CLI. The install job and an
# operator's `kubectl exec` use that same immutable artefact (ADR-0102).
image:
  # Release coordinate only; published availability is not established.
  # Supply an image built from this checkout or a pull-verified registry image.
  repository: ghcr.io/synveda/product
  # Empty means Chart.appVersion — the chart deploys the release it names.
  tag: ""
  # Set a sha256 digest instead of a tag to pin the exact product image.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# OpenShift omits numeric IDs from application/TEI pod contexts. See PORTABILITY.md
# for the restricted-v2/v3 overlays, admission evidence and v3 post-renderer.
platform: kubernetes

route:
  enabled: false
  annotations: {}
  # Empty uses the existing router's default certificate. OpenShift 4.19+.
  existingCertificateSecret: ""
  keycloakCertificateSecret: ""
  routerServiceAccount:
    name: router
    namespace: openshift-ingress

# Native HTTP client inputs only; OIDC deliberately ignores proxy variables.
# The Secret must contain HTTP_PROXY, HTTPS_PROXY and NO_PROXY (empty permitted).
outbound:
  proxyExistingSecret: ""
  caBundleExistingSecret: ""
  caBundleSecretKey: ca-bundle.crt

# Opt-in: specify actual peers before isolating workloads. No FQDN enforcement.
# ingress/dns/database are NetworkPolicyPeer lists; oidc and extraEgress contain
# complete NetworkPolicyEgressRule objects, including destination ports.
networkPolicy:
  enabled: false
  ingress: []
  dns: []
  database: []
  oidc: []
  extraEgress:
    gateway: []
    worker: []
    install: []
    keycloak: []
    tei: []
  # CNPG operator-managed pods need operator/control-plane allowances in addition
  # to SQL/replication. Required in CNPG mode when policies are enabled.
  postgresIngress: []
  postgresEgress: []

# ── The gateway ──────────────────────────────────────────────────────────
gateway:
  # There is no `replicas` key, and setting one is an error rather than a
  # no-op. One replica is a property of the process, not a starting point:
  # pending logins remain process-local, and cross-process policy/entity
  # convergence has no accepted multi-replica bound. OPS-7 must prove login
  # handoff and authority-mutation visibility before replicas. This is refused
  # rather than silently accepted; ADR-0062 decision 4 inventories what is
  # already safe across processes.

  # The externally reachable origin — the ingress host, not the Service.
  # SYNVEDA_PUBLIC_URL is where the gateway builds its /auth/callback
  # redirect URI and the Origin it checks console sessions against, so a
  # Service URL here is a console that refuses every session for a reason
  # that reads like a bug. Required.
  publicUrl: ""

  # Explicitly admits plaintext application and OIDC origins for disposable
  # development/test deployments. Leave false for HTTPS reference and hosted
  # deployments. The chart refuses HTTP without this opt-in and refuses this
  # opt-in when publicUrl is HTTPS.
  insecureDevelopmentHttp: false

  # Operator-owned Secret. External mode uses only DATABASE_URL with its full
  # verified TLS parameters (README.md). CNPG mode needs two distinct keys:
  #
  #   DATABASE_URL  postgres://synveda_gateway:<password>@<rw-service>:5432/synveda
  #   password      the exact password embedded in DATABASE_URL
  #
  # Database bootstrap consumes only `password`; preflight and the gateway
  # mount only `DATABASE_URL`. It must be distinct from both the CNPG
  # migration-owner Secret and the worker Secret. Required.
  databaseExistingSecret: ""
  databaseUrlSecretKey: DATABASE_URL
  databasePasswordSecretKey: password

  # The synchronous request pool. Size it together with the worker pool
  # against postgres.maxConnections; migration/operator connections still
  # need headroom.
  dbMaxConnections: 20
  shutdownSeconds: 30

  logLevel: info
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# ── The core worker ─────────────────────────────────────────────────────
worker:
  # Operator-owned Secret. External mode uses only the complete verified-TLS
  # DATABASE_URL; CNPG mode also requires the password-only key:
  #
  #   DATABASE_URL  postgres://synveda_worker:<password>@<rw-service>:5432/synveda
  #   password      the exact password embedded in DATABASE_URL
  #
  # Database bootstrap uses `password` only to create/converge the fixed
  # `synveda_worker` login. The process mounts only `DATABASE_URL` as a file;
  # neither value is rendered into the Pod manifest. Required.
  databaseExistingSecret: ""
  databaseUrlSecretKey: DATABASE_URL
  databasePasswordSecretKey: password

  # One worker is deliberate until every owned loop has multi-worker
  # acceptance. The chart refuses replica keys rather than ignoring them.
  dbMaxConnections: 8
  shutdownSeconds: 75
  logLevel: info
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

service:
  # ClusterIP is the only base exposure; use ingress or private access.
  type: ClusterIP
  port: 8120
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Must be the host in gateway.publicUrl. The chart compares them and
  # fails to render if they disagree — two settings that must agree are two
  # settings that will not.
  host: ""
  tls: []
  # Explicitly acknowledge an existing HTTPS terminator in front of Ingress.
  # Otherwise HTTPS ingress requires a TLS Secret for the public host.
  externalTlsTermination: false

# ── PostgreSQL: external or optional CloudNativePG ───────────────────────
# CNPG mode renders a Cluster for an operator that is already installed.
postgres:
  # external | bundled | cnpg. Only cnpg requires a preinstalled operator.
  mode: external
  # One namespaced server. Secrets are prepared separately and retained by
  # their operator; templates never generate passwords or encryption keys.
  bundled:
    image: ""
    administratorExistingSecret: ""
    administratorPasswordSecretKey: password
    migratorExistingSecret: ""
    migratorPasswordSecretKey: password
    migratorUrlSecretKey: uri
    tlsExistingSecret: ""
    tlsCertSecretKey: tls.crt
    tlsKeySecretKey: tls.key
    caSecretKey: ca.crt
    existingClaim: ""
    storageClass: ""
    size: 10Gi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # Required in external mode; use the example in ci/external-values.yaml.
  # host, port, database, migratorExistingSecret, migratorUrlSecretKey,
  # caExistingSecret, caSecretKey and roles select the existing SQLx contract.
  # Optional clientExistingSecret/clientCertSecretKey/clientKeySecretKey mount
  # an additional PEM client certificate and PKCS#8 key for mutual TLS.
  external: {}
  # Built from deploy/helm/postgres/Dockerfile: the CNPG base plus pgvector.
  # Empty means
  # ghcr.io/synveda/cnpg-postgres:17.11-synveda-<Chart.appVersion>.
  # CloudNativePG requires a direct image tag to begin with its PostgreSQL
  # version; the Synveda release remains paired in the suffix. An operator may
  # still supply an exact registry reference (preferably the version-bearing
  # tag plus a digest) explicitly.
  # Epoch 3 has no queue or graph-extension dependency.
  image: ""
  instances: 1
  # Keep the Cluster, its operator-owned credentials and PVCs on uninstall.
  # A retained Cluster continues running; see STARTER.md for deliberate cleanup.
  retain: false
  primaryUpdateStrategy: unsupervised
  storage:
    size: 100Gi
    storageClass: ""
  maxConnections: 200
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
  # Passed through to the Cluster's postgresql.parameters.
  parameters: {}
  # Barman/object-store backup is OPS-5's, not this chart's. A `backup`
  # stanza that exists and is empty reads like a backup that exists.

# ── Identity ─────────────────────────────────────────────────────────────
oidc:
  # Name of an existing Secret holding the trust-entry JSON, mounted as
  # SYNVEDA_OIDC_ISSUERS_FILE. The same trust contract applies to external or
  # packaged Keycloak; provider installation does not infer issuer authority.
  # The chart never generates it: issuer configuration names a directory, and
  # a chart that writes one has invented a trust relationship.
  #
  #   kubectl create secret generic synveda-oidc \
  #     --from-file=SYNVEDA_OIDC_ISSUERS=./issuers.json
  #
  # Required. There is deliberately no key for SYNVEDA_DEV_JWT_SECRET: the
  # HS256 dev mode is not a deployment (ADR-0010 decision 3), and the chart
  # cannot express it.
  existingSecret: ""
  secretKey: SYNVEDA_OIDC_ISSUERS
  # Optional private root CA, added to platform trust for the OIDC client.
  caExistingSecret: ""
  caSecretKey: ca.crt

# Optional upstream Keycloak chart; external OIDC remains the default.
# These provider image coordinates are fixed, never derived from appVersion.
# Build the existing optimized Dockerfile or supply a pull-verified digest.
keycloak:
  enabled: false
  publicUrl: ""
  # Explicit loopback-only port-forward evaluation; HTTPS remains the default.
  localEvaluation: false
  evaluationAccountsExistingSecret: ""
  proxyTrustedAddresses: ""
  adminExistingSecret: ""
  databaseCaExistingSecret: ""
  databaseCaSecretKey: ca.crt
  image:
    repository: ghcr.io/synveda/keycloak
    tag: "0.4.0"
    digest: ""
  replicas: 1
  updateStrategy: OnDelete
  # The optimized image already uses /. The upstream chart always emits this
  # build-time env var; remove it so optimized startup uses the persisted path.
  command: ["/usr/bin/env", "-u", "KC_HTTP_RELATIVE_PATH", "/opt/keycloak/bin/kc.sh"]
  args: ["start", "--optimized", "--cache=local", "--import-realm"]
  enableServiceLinks: false
  serviceAccount:
    automountServiceAccountToken: false
    allowReadPods: false
  podSecurityContext:
    fsGroup: null
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsUser: null
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  dbchecker:
    enabled: false
  database:
    vendor: postgres
    hostname: ""
    port: 5432
    database: keycloak
    username: keycloak
    existingSecret: ""
    existingSecretKey: password
  cache:
    stack: custom
  proxy:
    enabled: true
    mode: xforwarded
    http:
      enabled: true
  http:
    relativePath: /
  extraEnv: |
    - name: KC_HOSTNAME
      value: {{ .Values.publicUrl | quote }}
    - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
      value: {{ .Values.localEvaluation | quote }}
    - name: KC_HOSTNAME_STRICT
      value: "true"
    - name: KC_PROXY_TRUSTED_ADDRESSES
      value: {{ .Values.proxyTrustedAddresses | quote }}
    - name: KC_DB_URL_PROPERTIES
      value: "?sslmode=verify-full&sslrootcert=/run/keycloak-db-ca/ca.crt"
    {{- if not .Values.localEvaluation }}
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      valueFrom:
        secretKeyRef:
          name: {{ .Values.adminExistingSecret }}
          key: username
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: {{ .Values.adminExistingSecret }}
          key: password
    {{- end }}
    {{- if .Values.evaluationAccountsExistingSecret }}
    {{- range $role := list "admin" "member" "approver" "viewer" }}
    - name: SYNVEDA_DEMO_{{ upper $role }}_PASSWORD
      valueFrom:
        secretKeyRef:
          name: {{ $.Values.evaluationAccountsExistingSecret }}
          key: {{ $role }}
    {{- end }}
    {{- end }}
  extraVolumes: |
    - name: realm
      configMap:
        name: {{ printf "%s-keycloak-realm" .Release.Name | trunc 63 | trimSuffix "-" }}
    - name: temporary
      emptyDir:
        medium: Memory
        sizeLimit: 128Mi
    - name: data
      emptyDir:
        sizeLimit: 128Mi
    - name: database-ca
      secret:
        secretName: {{ .Values.databaseCaExistingSecret }}
        items:
          - key: {{ .Values.databaseCaSecretKey }}
            path: ca.crt
  extraVolumeMounts: |
    - name: realm
      mountPath: /opt/keycloak/data/import
      readOnly: true
    - name: temporary
      mountPath: /tmp
    - name: data
      mountPath: /opt/keycloak/data
    - name: database-ca
      mountPath: /run/keycloak-db-ca
      readOnly: true
  service:
    type: ClusterIP
    httpsPort: null
  ingress:
    enabled: false
    rules:
      - host: '{{ (urlParse .Values.publicUrl).host }}'
        paths:
          - path: /realms/synveda
            pathType: Prefix
          - path: /resources
            pathType: Prefix
    tls: []
    console:
      enabled: false
  resources:
    requests:
      cpu: 500m
      # OPS-11's four-agent run observed about 1 GiB after identity startup.
      # Reserve headroom; this remains a starting point, not a capacity promise.
      memory: 1280Mi
    limits:
      memory: 2Gi

# ── Local key custody ────────────────────────────────────────────────────
kms:
  # Name of an existing Secret holding the local KMS key and its stable
  # reference. Gateway, worker and optional tenant admission use it; the chart never
  # creates, prints or owns the key. Losing it makes every wrapped tenant key
  # unrecoverable; back up and restore this Secret outside the database.
  #
  #   kubectl create secret generic synveda-kms \
  #     --from-file=SYNVEDA_KMS_KEY=./private/kms-key \
  #     --from-file=SYNVEDA_KMS_KEY_REF=./private/kms-key-ref
  #
  # Mounted as SYNVEDA_KMS_KEY_FILE and SYNVEDA_KMS_KEY_REF_FILE.
  # Required. This proves only that startup names a custody source; it does
  # not provide cloud KMS/HSM integration or a rotation/restore procedure.
  existingSecret: ""
  secretKey: SYNVEDA_KMS_KEY
  keyRefSecretKey: SYNVEDA_KMS_KEY_REF

# ── The embedder: a data decision, not a preference ──────────────────────
# Knowledge embedding rows retain model and dimension and the dense leg filters
# on both. A model change converges a separately labelled sidecar; it never
# reinterprets an old vector as output from a new model. The deterministic
# implementation is lexical-only and must not be presented as semantic.
#
# `deterministic` | `tei`. Required.
embedder: ""
embedderModel: ""

tei:
  # Run TEI in-cluster. Off and unset is fine when embedder is
  # `deterministic`; with `tei` you must set this or `tei.url`.
  enabled: false
  # An existing TEI endpoint instead (`http://host:port`).
  url: ""
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.1
  model: BAAI/bge-m3
  maxBatchTokens: 4096
  # BGE-M3 is ~2.3 GB. A pod that re-downloads it on every restart is a pod
  # that is never ready, so the cache is a volume rather than emptyDir.
  cache:
    existingClaim: ""
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
  # The upstream image defaults to root. These overridable values give its
  # cache a non-root owner; remove UID/fsGroup on platforms assigning them.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# ── The extractor: a runtime choice, unlike the embedder ─────────────────
# Changing it changes what future extraction produces and invalidates
# nothing already written.
extractor:
  # `deterministic` | `claude` | `vllm`
  kind: deterministic
  model: ""
  # For `claude`: a Secret with key ANTHROPIC_API_KEY. For `vllm`: both
  # baseUrl and model are required.
  existingSecret: ""
  secretKey: ANTHROPIC_API_KEY
  baseUrl: ""

# ── The install job ──────────────────────────────────────────────────────
install:
  # In CNPG mode the Job first converges roles/extensions under its administrator;
  # external mode performs no administrative provisioning. It then
  # proves the migrator/gateway/worker targets through the product preflight,
  # migrates and optionally converges one tenant under the configured migrator.
  # No product or runtime container receives the superuser credential.
  # Optionally converge one tenant by a preselected UUIDv7 on each install/upgrade.
  # Leave empty for operator-managed admission; see README.md.
  tenant:
    # Preselect one UUIDv7, also used in the issuer Secret static tenant binding.
    id: ""
    slug: ""
    name: ""
  # Bounds bootstrap, authority preflight, schema migration and optional
  # first-tenant admission as one deployment operation.
  activeDeadlineSeconds: 900
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# ── Telemetry ────────────────────────────────────────────────────────────
otel:
  # OTLP gRPC endpoint for both runtime processes. Empty means their default
  # (http://localhost:4317), which in a pod means nothing is collecting.
  endpoint: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  # No fixed UID/GID: ordinary Kubernetes uses the image UID; platforms may
  # assign an allowed identity. Projected Secrets are readable only in the
  # containers that mount them (0444); no application container shares them.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
