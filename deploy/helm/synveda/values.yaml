# Synveda Kubernetes deployment (OPS-2; CPR-36, ADR-0095).
#
# This chart sizes infrastructure and connects external services. It never
# selects personal, team or enterprise product behaviour: those are immutable
# governed Configuration versions and scope bindings in the one runtime.
#
# Five values have no default and the chart refuses to render without them:
# `gateway.publicUrl`, `embedder`, `oidc.existingSecret`,
# `kms.existingSecret`, and — if the embedder is `tei` — one of
# `tei.enabled` or `tei.url`. Each is a decision somebody has to make on
# purpose; a default would make it silently.

# ── The product image ────────────────────────────────────────────────────
# Carries both binaries: the gateway serves, and the `synveda` CLI is what
# the install job and an operator's `kubectl exec` use (ADR-0062 amendment).
image:
  repository: synveda/gateway
  # Empty means Chart.appVersion — the chart deploys the release it names.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# ── The gateway ──────────────────────────────────────────────────────────
gateway:
  # There is no `replicas` key, and setting one is an error rather than a
  # no-op. One replica is a property of the process, not a starting point:
  # pending logins live in memory (`LoginFlow` — a callback on the wrong pod
  # is a 401 for a login the IdP completed) and the scope-chain cache is
  # invalidated in-process with no TTL (a scope move handled by one
  # replica leaves the others composing against the ancestry the mover
  # left). Both fail silently, which is why this is refused rather than
  # discouraged. OPS-7 is the feature that lifts it; ADR-0062 decision 4
  # has the full inventory of what *is* already safe across processes.

  # The externally reachable origin — the ingress host, not the Service.
  # SYNVEDA_PUBLIC_URL is where the gateway builds its /auth/callback
  # redirect URI and the Origin it checks console sessions against, so a
  # Service URL here is a console that refuses every session for a reason
  # that reads like a bug. Required.
  publicUrl: ""

  # The pool the request handlers and the background loops share. Size it
  # against postgres.maxConnections: this many per gateway, plus whatever
  # else connects to the cluster, has to fit.
  dbMaxConnections: 20

  logLevel: info
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

service:
  type: ClusterIP
  port: 8120

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Must be the host in gateway.publicUrl. The chart compares them and
  # fails to render if they disagree — two settings that must agree are two
  # settings that will not.
  host: ""
  tls: []

# ── Postgres (CloudNativePG) ─────────────────────────────────────────────
# The operator is not installed by this chart (ADR-0062 decision 1); this
# renders a Cluster for an operator that is already there.
postgres:
  # Built from deploy/helm/postgres/Dockerfile: the CNPG base plus pgvector.
  # Epoch 3 has no queue or graph-extension dependency.
  image: synveda/enterprise-postgres:17
  instances: 3
  storage:
    size: 100Gi
    storageClass: ""
  maxConnections: 200
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
  # Passed through to the Cluster's postgresql.parameters.
  parameters: {}
  # Barman/object-store backup is OPS-5's, not this chart's. A `backup`
  # stanza that exists and is empty reads like a backup that exists.

# ── Identity ─────────────────────────────────────────────────────────────
oidc:
  # Name of an existing Secret holding the trust-entry JSON. The chart never
  # generates it: an issuer configuration names a customer's directory, and
  # a chart that writes one has invented a trust relationship.
  #
  #   kubectl create secret generic synveda-oidc \
  #     --from-file=SYNVEDA_OIDC_ISSUERS=./issuers.json
  #
  # Required. There is deliberately no key for SYNVEDA_DEV_JWT_SECRET: the
  # HS256 dev mode is not a deployment (ADR-0010 decision 3), and the chart
  # cannot express it.
  existingSecret: ""
  secretKey: SYNVEDA_OIDC_ISSUERS

# ── Local key custody ────────────────────────────────────────────────────
kms:
  # Name of an existing Secret holding the local KMS key and its stable
  # reference. The chart wires custody into the gateway but never creates,
  # prints or owns the key. Losing it makes every wrapped tenant key
  # unrecoverable; back up and restore this Secret outside the database.
  #
  #   kubectl create secret generic synveda-kms \
  #     --from-literal=SYNVEDA_KMS_KEY="$(synveda kms keygen)" \
  #     --from-literal=SYNVEDA_KMS_KEY_REF=local:production
  #
  # Required. This proves only that startup names a custody source; it does
  # not provide cloud KMS/HSM integration or a rotation/restore procedure.
  existingSecret: ""
  secretKey: SYNVEDA_KMS_KEY
  keyRefSecretKey: SYNVEDA_KMS_KEY_REF

# ── The embedder: a data decision, not a preference ──────────────────────
# Knowledge embedding rows retain model and dimension and the dense leg filters
# on both. A model change converges a separately labelled sidecar; it never
# reinterprets an old vector as output from a new model. The deterministic
# implementation is lexical-only and must not be presented as semantic.
#
# `deterministic` | `tei`. Required.
embedder: ""
embedderModel: ""

tei:
  # Run TEI in-cluster. Off and unset is fine when embedder is
  # `deterministic`; with `tei` you must set this or `tei.url`.
  enabled: false
  # An existing TEI endpoint instead (`http://host:port`).
  url: ""
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.1
  model: BAAI/bge-m3
  maxBatchTokens: 4096
  # BGE-M3 is ~2.3 GB. A pod that re-downloads it on every restart is a pod
  # that is never ready, so the cache is a volume rather than emptyDir.
  cache:
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: "2"
      memory: 4Gi

# ── The extractor: a runtime choice, unlike the embedder ─────────────────
# Changing it changes what future extraction produces and invalidates
# nothing already written.
extractor:
  # `deterministic` | `claude` | `vllm`
  kind: deterministic
  model: ""
  # For `claude`: a Secret with key ANTHROPIC_API_KEY. For `vllm`: both
  # baseUrl and model are required.
  existingSecret: ""
  baseUrl: ""

# ── The install job ──────────────────────────────────────────────────────
install:
  # Runs `synveda db migrate` under the cluster's superuser, then grants the
  # gateway's login role membership of `synveda_app` — the least-privilege
  # role every migration has been granting since 0003. The gateway itself
  # never holds an admin credential (ADR-0062 decision 2).
  enabled: true
  # Optionally admit the first tenant in the same job. Leave the slug empty
  # and NOTES.txt prints the command instead; a chart that hardcodes one
  # tenant into a multi-tenant product is guessing.
  tenant:
    slug: ""
    name: ""
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600

# ── Telemetry ────────────────────────────────────────────────────────────
otel:
  # OTLP gRPC endpoint. Empty means the gateway's own default
  # (http://localhost:4317), which in a pod means nothing is collecting.
  endpoint: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
