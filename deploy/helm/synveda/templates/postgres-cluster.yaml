{{- /*
The Kubernetes data plane (OPS-2, ADR-0062 decision 1). CloudNativePG runs
the cluster, elects the primary and publishes two secrets:

  <cluster>-app         the ordinary `synveda_migrator` database/schema owner
  <cluster>-superuser   the bootstrap container's identity, and nothing else's

`enableSuperuserAccess` is deliberate: deployment bootstrap converges roles,
extensions and ACLs before the ordinary migrator runs the application DDL.
No product operation or runtime process receives this credential.
*/ -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "synveda.clusterName" . }}
  labels:
    {{- include "synveda.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.image }}
  enableSuperuserAccess: true

  bootstrap:
    initdb:
      database: {{ include "synveda.dbName" . }}
      owner: {{ include "synveda.migratorRole" . }}
      # The shared cluster authority proof is deliberately first. PostgreSQL
      # grants PUBLIC CONNECT to these maintenance databases by default; the
      # required install Job refuses that cross-database path and must not be
      # asked to repair it after its read-only guard. CNPG also creates the
      # application database with a default/null ACL; close it before the Job
      # so the shared bootstrap sees its only recoverable initial state and
      # transactionally publishes the terminal explicit ACL before reopening.
      postInitSQL:
        - revoke connect, temporary on database postgres, template1 from public;
        - alter database {{ include "synveda.dbName" . }} allow_connections false;
      # Extension binaries are image inputs only. The required install Job
      # creates and proves the exact extension versions as its declared
      # bootstrap administrator; CNPG's application-owner hook must not create
      # a conflicting ownership shape first.

  postgresql:
    parameters:
      max_connections: {{ .Values.postgres.maxConnections | quote }}
      {{- with .Values.postgres.parameters }}
      {{- toYaml . | nindent 6 }}
      {{- end }}

  storage:
    size: {{ .Values.postgres.storage.size }}
    {{- with .Values.postgres.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}

  {{- with .Values.postgres.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
