{{- if and (eq .Values.postgres.mode "cnpg") .Values.postgres.backup.enabled }}
# OPS-5: base backups accompany the Cluster's continuous plugin WAL archive.
# Keep generated Backup CRs independent of this schedule and the Helm release.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "synveda.clusterName" . }}-backup
  labels:
    {{- include "synveda.labels" . | nindent 4 }}
spec:
  cluster:
    name: {{ include "synveda.clusterName" . }}
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  backupOwnerReference: none
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
