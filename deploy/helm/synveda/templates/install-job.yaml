{{- /*
The required, revision-named install Job implements the same authority order as
the Compose reference (CPR-45, ADR-0102):

  1. database-bootstrap — CNPG-only role, extension, ownership and ACL
     convergence through the shared administrator PostgreSQL command;
  2. database-preflight — the product proves the migrator, gateway and worker
     credentials select one writable database generation and exact roles;
  3. migrate — the product advances application DDL as `synveda_migrator`;
  4. tenant — optional, idempotent admission under that same migrator.

The superuser password is mounted only into the bootstrap init container.
Product and runtime containers never receive it. External providers are already
provisioned. The Job is not a Helm hook: CNPG resources can be created beside it.
Gateway and worker may
start independently, but their product-owned authority sentinels remain closed
until this Job has established the complete contract. A revision suffix is
required because a Job spec is immutable.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "synveda.fullname" . }}-install-{{ .Release.Revision }}
  labels:
    {{- include "synveda.labels" . | nindent 4 }}
    app.kubernetes.io/component: install
spec:
  activeDeadlineSeconds: {{ .Values.install.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.install.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.install.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "synveda.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: install
      {{- with .Values.install.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "synveda.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if eq .Values.postgres.mode "cnpg" }}
        - name: database-bootstrap
          image: {{ include "synveda.postgresImage" . }}
          resources:
            {{- toYaml .Values.install.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Kubernetes' atomic Secret writer exposes projected keys as
          # symlinks. The shared bootstrap command deliberately refuses every
          # symlink, so this container copies only fixed, read-only projection
          # paths into a private memory-backed volume before invoking it. No
          # value is placed in an argument, environment variable or log.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              for secret in \
                postgres_bootstrap_password \
                synveda_migrator_password \
                synveda_gateway_password \
                synveda_worker_password{{ if .Values.keycloak.enabled }} \
                keycloak_database_password{{ end }}
              do
                source=/run/bootstrap-projection/$secret
                destination=/run/secrets/$secret
                if [ ! -r "$source" ] || [ ! -f "$source" ]; then
                  echo "database-bootstrap: required Secret projection is unreadable" >&2
                  exit 78
                fi
                cp -- "$source" "$destination"
                chmod 0600 "$destination"
              done
              if [ ! -r /run/database-roles/roles.json ] || [ ! -f /run/database-roles/roles.json ]; then
                echo "database-bootstrap: database role contract projection is unreadable" >&2
                exit 78
              fi
              cp -- /run/database-roles/roles.json /run/secrets/database_roles.json
              chmod 0600 /run/secrets/database_roles.json
              {{- if .Values.keycloak.enabled }}
              mkdir -p /run/database-authority/private
              chmod 0700 /run/database-authority/private
              /usr/local/bin/synveda-database-bootstrap synveda
              /usr/local/bin/synveda-database-bootstrap keycloak
              # This content-free witness crosses images with different UIDs.
              # Init-container ordering leaves no concurrent writer; preflight
              # copies the read-only handoff into its own private directory.
              cp /run/database-authority/private/keycloak-cluster.json /run/database-authority/keycloak-cluster.json
              chmod 0444 /run/database-authority/keycloak-cluster.json
              {{- else }}
              exec /usr/local/bin/synveda-database-bootstrap synveda
              {{- end }}
          env:
            - name: SYNVEDA_POSTGRES_BOOTSTRAP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "synveda.superuserSecret" . }}
                  key: username
            - name: SYNVEDA_POSTGRES_BOOTSTRAP_URL
              value: postgresql://$(SYNVEDA_POSTGRES_BOOTSTRAP_USER)@{{ include "synveda.clusterName" . }}-rw:5432/postgres
            - name: SYNVEDA_POSTGRES_BUNDLED_CLUSTER
              value: "true"
            - name: SYNVEDA_DATABASE_BOOTSTRAP_PRIVATE_DIR
              value: /run/secrets
            - name: SYNVEDA_DATABASE_ROLES_FILE
              value: /run/secrets/database_roles.json
            {{- if .Values.keycloak.enabled }}
            - name: SYNVEDA_DATABASE_REQUIRE_KEYCLOAK_PASSWORD
              value: "true"
            - name: SYNVEDA_DATABASE_AUTHORITY_DIR
              value: /run/database-authority/private
            {{- end }}
          volumeMounts:
            - name: bootstrap-projection
              mountPath: /run/bootstrap-projection
              readOnly: true
            - name: bootstrap-private
              mountPath: /run/secrets
            - name: bootstrap-snapshots
              mountPath: /tmp
            - name: database-roles
              mountPath: /run/database-roles
              readOnly: true
            {{- if .Values.keycloak.enabled }}
            - name: database-authority
              mountPath: /run/database-authority
            {{- end }}

        {{- end }}
        - name: database-preflight
          image: {{ include "synveda.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.install.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              {{- if and .Values.keycloak.enabled (eq .Values.postgres.mode "cnpg") }}
              umask 077
              mkdir -p /run/preflight-authority/private
              chmod 0700 /run/preflight-authority/private
              cp /run/database-authority/keycloak-cluster.json /run/preflight-authority/private/keycloak-cluster.json
              chmod 0600 /run/preflight-authority/private/keycloak-cluster.json
              {{- end }}
              attempt=1
              while ! /usr/local/bin/synveda-container database-preflight; do
                if [ "$attempt" -ge 12 ]; then
                  echo "database preflight exhausted 12 bounded attempts" >&2
                  exit 1
                fi
                echo "database preflight pending; retry $attempt/12" >&2
                attempt=$((attempt + 1))
                sleep 5
              done
          env:
            {{- include "synveda.databaseTransportEnv" . | nindent 12 }}
            - name: SYNVEDA_MIGRATOR_DATABASE_URL_FILE
              value: /run/secrets/synveda-preflight/migrator_database_url
            - name: SYNVEDA_GATEWAY_DATABASE_URL_FILE
              value: /run/secrets/synveda-preflight/gateway_database_url
            - name: SYNVEDA_WORKER_DATABASE_URL_FILE
              value: /run/secrets/synveda-preflight/worker_database_url
            - name: SYNVEDA_DATABASE_ROLES_FILE
              value: /etc/synveda/database/roles.json
            {{- if and .Values.keycloak.enabled (eq .Values.postgres.mode "cnpg") }}
            - name: SYNVEDA_DATABASE_REQUIRED_PEER
              value: keycloak
            - name: SYNVEDA_DATABASE_PEER_WITNESS_FILE
              value: /run/preflight-authority/private/keycloak-cluster.json
            {{- end }}
          volumeMounts:
            {{- include "synveda.databaseTransportMounts" . | nindent 12 }}
            - name: preflight-databases
              mountPath: /run/secrets/synveda-preflight
              readOnly: true
            - name: database-roles
              mountPath: /etc/synveda/database
              readOnly: true
            {{- if and .Values.keycloak.enabled (eq .Values.postgres.mode "cnpg") }}
            - name: database-authority
              mountPath: /run/database-authority
              readOnly: true
            - name: preflight-authority
              mountPath: /run/preflight-authority
            {{- end }}

        - name: migrate
          image: {{ include "synveda.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.install.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["/usr/bin/timeout", "--signal=TERM", "--kill-after=5s", "300s"]
          args: ["/usr/local/bin/synveda-container", "migrate"]
          env:
            {{- include "synveda.databaseTransportEnv" . | nindent 12 }}
            - name: DATABASE_URL_FILE
              value: /run/secrets/synveda-migrator/database_url
            - name: SYNVEDA_DATABASE_ROLES_FILE
              value: /etc/synveda/database/roles.json
          volumeMounts:
            {{- include "synveda.databaseTransportMounts" . | nindent 12 }}
            - name: migrator-database
              mountPath: /run/secrets/synveda-migrator
              readOnly: true
            - name: database-roles
              mountPath: /etc/synveda/database
              readOnly: true

      containers:
        - name: tenant
          image: {{ include "synveda.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.install.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.install.tenant.slug }}
          args: ["tenant-converge"]
          env:
            - name: SYNVEDA_BOOTSTRAP_TENANT_ID
              value: {{ .Values.install.tenant.id | quote }}
            - name: SYNVEDA_BOOTSTRAP_TENANT_SLUG
              value: {{ .Values.install.tenant.slug | quote }}
            - name: SYNVEDA_BOOTSTRAP_TENANT_NAME
              value: {{ default .Values.install.tenant.slug .Values.install.tenant.name | quote }}
            - name: SYNVEDA_KMS_KEY_FILE
              value: /run/secrets/synveda-kms/key
            - name: SYNVEDA_KMS_KEY_REF_FILE
              value: /run/secrets/synveda-kms/reference
            - name: DATABASE_URL_FILE
              value: /run/secrets/synveda-migrator/database_url
            - name: SYNVEDA_DATABASE_ROLES_FILE
              value: /etc/synveda/database/roles.json
            {{- include "synveda.databaseTransportEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "synveda.databaseTransportMounts" . | nindent 12 }}
            - name: tenant-kms
              mountPath: /run/secrets/synveda-kms
              readOnly: true
            - name: migrator-database
              mountPath: /run/secrets/synveda-migrator
              readOnly: true
            - name: database-roles
              mountPath: /etc/synveda/database
              readOnly: true
          {{- else }}
          command: ["/bin/sh", "-ec"]
          args: ["echo 'database preflight and migration complete; tenant admission is operator-owned'"]
          {{- end }}

      {{- with .Values.install.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.install.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.install.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "synveda.databaseTransportVolumes" . | nindent 8 }}
        {{- if .Values.install.tenant.slug }}
        - name: tenant-kms
          secret:
            secretName: {{ .Values.kms.existingSecret }}
            defaultMode: 0444
            items:
              - key: {{ .Values.kms.secretKey }}
                path: key
              - key: {{ .Values.kms.keyRefSecretKey }}
                path: reference
        {{- end }}
        {{- if eq .Values.postgres.mode "cnpg" }}
        - name: bootstrap-projection
          projected:
            defaultMode: 0444
            sources:
              - secret:
                  name: {{ include "synveda.superuserSecret" . }}
                  items:
                    - key: password
                      path: postgres_bootstrap_password
              - secret:
                  name: {{ include "synveda.migratorSecret" . }}
                  items:
                    - key: password
                      path: synveda_migrator_password
              - secret:
                  name: {{ .Values.gateway.databaseExistingSecret }}
                  items:
                    - key: {{ .Values.gateway.databasePasswordSecretKey }}
                      path: synveda_gateway_password
              - secret:
                  name: {{ .Values.worker.databaseExistingSecret }}
                  items:
                    - key: {{ .Values.worker.databasePasswordSecretKey }}
                      path: synveda_worker_password
              {{- if .Values.keycloak.enabled }}
              - secret:
                  name: {{ .Values.keycloak.database.existingSecret }}
                  items:
                    - key: {{ .Values.keycloak.database.existingSecretKey }}
                      path: keycloak_database_password
              {{- end }}
        {{- if .Values.keycloak.enabled }}
        - name: database-authority
          emptyDir:
            medium: Memory
            sizeLimit: 64Ki
        - name: preflight-authority
          emptyDir:
            medium: Memory
            sizeLimit: 64Ki
        {{- end }}
        - name: bootstrap-private
          emptyDir:
            medium: Memory
            # Four 4096-byte credentials, one 4096-byte role contract and the
            # three-line pgpass whose escaping can double password bytes must
            # fit together. Keep bounded headroom for filenames and metadata.
            sizeLimit: 64Ki
        - name: bootstrap-snapshots
          emptyDir:
            medium: Memory
            # The shared shell keeps bounded input snapshots here and may
            # materialise its fixed SQL heredoc in TMPDIR. Match the 16 MiB
            # Compose bootstrap tmpfs so either supported /bin/sh strategy
            # fits without turning /tmp into unbounded node storage.
            sizeLimit: 16Mi
        {{- end }}
        - name: preflight-databases
          projected:
            defaultMode: 0444
            sources:
              - secret:
                  name: {{ include "synveda.migratorSecret" . }}
                  items:
                    - key: {{ include "synveda.migratorUrlKey" . }}
                      path: migrator_database_url
              - secret:
                  name: {{ .Values.gateway.databaseExistingSecret }}
                  items:
                    - key: {{ .Values.gateway.databaseUrlSecretKey }}
                      path: gateway_database_url
              - secret:
                  name: {{ .Values.worker.databaseExistingSecret }}
                  items:
                    - key: {{ .Values.worker.databaseUrlSecretKey }}
                      path: worker_database_url
        - name: migrator-database
          secret:
            secretName: {{ include "synveda.migratorSecret" . }}
            defaultMode: 0444
            items:
              - key: {{ include "synveda.migratorUrlKey" . }}
                path: database_url
        - name: database-roles
          configMap:
            name: {{ include "synveda.fullname" . }}-database-roles
            items:
              - key: roles.json
                path: roles.json
