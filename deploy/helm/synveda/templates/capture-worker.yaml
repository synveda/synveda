{{- if gt (int .Values.worker.captureOnlyReplicas) 0 }}
{{- /* ADR-0129: these pods run only the fenced Capture loop. The combined
worker remains the sole owner of Knowledge, directory and other maintenance.
The explicit manifest keeps maintenance-only secrets off capture pods. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synveda.fullname" . }}-capture-worker
  labels:
    {{- include "synveda.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.captureOnlyReplicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "synveda.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: capture-worker
  template:
    metadata:
      labels:
        {{- include "synveda.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: capture-worker
      annotations:
        checksum/database-roles: {{ include "synveda.databaseRolesJson" . | sha256sum }}
      {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "synveda.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ add (int .Values.worker.shutdownSeconds) 10 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "synveda.podSecurity" (dict "root" . "context" .Values.podSecurityContext) | nindent 8 }}
      containers:
        - name: capture-worker
          image: {{ include "synveda.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "synveda.outboundEnv" . | nindent 12 }}
            - name: DATABASE_URL_FILE
              value: /run/secrets/synveda-worker/database_url
            - name: SYNVEDA_DATABASE_ROLES_FILE
              value: /etc/synveda/database/roles.json
            - name: SYNVEDA_WORKER_PROFILE
              value: capture-only
            - name: SYNVEDA_WORKER_DB_MAX_CONNECTIONS
              value: {{ .Values.worker.dbMaxConnections | quote }}
            - name: SYNVEDA_WORKER_SHUTDOWN_SECS
              value: {{ .Values.worker.shutdownSeconds | quote }}
            - name: SYNVEDA_WORKER_LISTEN_ADDR
              value: 127.0.0.1:8121
            {{- include "synveda.databaseTransportEnv" . | nindent 12 }}
            - name: SYNVEDA_EXTRACTOR
              value: {{ .Values.extractor.kind | quote }}
            {{- with .Values.extractor.model }}
            - name: SYNVEDA_EXTRACTOR_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- if eq .Values.extractor.kind "claude" }}
            - name: ANTHROPIC_API_KEY_FILE
              value: /run/secrets/synveda-extractor/api_key
            {{- end }}
            {{- if eq .Values.extractor.kind "vllm" }}
            - name: SYNVEDA_VLLM_BASE_URL
              value: {{ .Values.extractor.baseUrl | quote }}
            {{- end }}
            {{- with .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.worker.logLevel | quote }}
          startupProbe:
            exec:
              command: ["/usr/local/bin/synveda-container", "probe", "worker", "live"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          livenessProbe:
            exec:
              command: ["/usr/local/bin/synveda-container", "probe", "worker", "live"]
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["/usr/local/bin/synveda-container", "probe", "worker", "ready"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            {{- include "synveda.outboundMounts" . | nindent 12 }}
            {{- include "synveda.databaseTransportMounts" . | nindent 12 }}
            {{- if eq .Values.extractor.kind "claude" }}
            - name: extractor
              mountPath: /run/secrets/synveda-extractor
              readOnly: true
            {{- end }}
            - name: worker-database
              mountPath: /run/secrets/synveda-worker
              readOnly: true
            - name: database-roles
              mountPath: /etc/synveda/database
              readOnly: true
            - name: tmp
              mountPath: /tmp
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "synveda.outboundVolumes" . | nindent 8 }}
        {{- include "synveda.databaseTransportVolumes" . | nindent 8 }}
        {{- if eq .Values.extractor.kind "claude" }}
        - name: extractor
          secret:
            secretName: {{ .Values.extractor.existingSecret }}
            defaultMode: 0444
            items:
              - key: {{ .Values.extractor.secretKey }}
                path: api_key
        {{- end }}
        - name: worker-database
          secret:
            secretName: {{ .Values.worker.databaseExistingSecret }}
            defaultMode: 0444
            items:
              - key: {{ .Values.worker.databaseUrlSecretKey }}
                path: database_url
        - name: database-roles
          configMap:
            name: {{ include "synveda.fullname" . }}-database-roles
            items:
              - key: roles.json
                path: roles.json
        - name: tmp
          emptyDir: {}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
