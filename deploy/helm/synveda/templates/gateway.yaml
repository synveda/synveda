{{- /*
The gateway: one replica, on purpose and not as a starting point
(ADR-0062 decision 4 — the chart refuses a values file that says
otherwise, in _helpers.tpl). `Recreate` follows from the same fact: two
gateways must not overlap even for the length of a rolling update.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synveda.fullname" . }}
  labels:
    {{- include "synveda.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "synveda.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "synveda.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      {{- with .Values.gateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "synveda.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "synveda.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8120
          env:
            - name: DATABASE_URL_FILE
              value: /run/secrets/synveda-gateway/database_url
            - name: SYNVEDA_DATABASE_ROLES_FILE
              value: /etc/synveda/database/roles.json
            # The image's default is 127.0.0.1:8120. A pod that binds
            # loopback is a pod no Service can reach.
            - name: SYNVEDA_LISTEN_ADDR
              value: 0.0.0.0:8120
            - name: SYNVEDA_PUBLIC_URL
              value: {{ .Values.gateway.publicUrl | quote }}
            - name: SYNVEDA_DB_MAX_CONNECTIONS
              value: {{ .Values.gateway.dbMaxConnections | quote }}
            - name: SYNVEDA_OIDC_ISSUERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret }}
                  key: {{ .Values.oidc.secretKey }}
            - name: SYNVEDA_KMS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kms.existingSecret }}
                  key: {{ .Values.kms.secretKey }}
            - name: SYNVEDA_KMS_KEY_REF
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kms.existingSecret }}
                  key: {{ .Values.kms.keyRefSecretKey }}
            - name: SYNVEDA_EMBEDDER
              value: {{ .Values.embedder | quote }}
            {{- with .Values.embedderModel }}
            - name: SYNVEDA_EMBEDDER_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- if eq .Values.embedder "tei" }}
            - name: SYNVEDA_TEI_URL
              value: {{ if .Values.tei.enabled }}http://{{ include "synveda.fullname" . }}-tei:80{{ else }}{{ .Values.tei.url }}{{ end }}
            {{- end }}
            {{- with .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.gateway.logLevel | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            # `select 1` against the pool, and since CPR-2 (ADR-0069) the
            # schema *epoch* beside it. It is honest about a database
            # outage — which is the property CNPG failover needs, since the
            # pool is `connect_lazy` and a lost primary must take this pod
            # out of the Service rather than crash-loop it. The continuously
            # evaluated product authority sentinel also proves the exact
            # role, grants, RLS, routines and schema surface before this
            # endpoint can report ready; no weaker init-container probe sits
            # in front of it.
            #
            # The epoch check is per-probe rather than at start for the same
            # reason the pool is lazy: a database that arrives *after* the
            # process would otherwise be behind a check that already ran. A
            # pod pointed at a pre-cut database therefore leaves the Service
            # rather than serving rows in a model it does not implement —
            # the product authority gate stays closed until the install job
            # has completed the exact deployment contract.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: gateway-database
              mountPath: /run/secrets/synveda-gateway
              readOnly: true
            - name: database-roles
              mountPath: /etc/synveda/database
              readOnly: true
            - name: tmp
              mountPath: /tmp
          {{- with .Values.gateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: gateway-database
          secret:
            secretName: {{ .Values.gateway.databaseExistingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.gateway.databaseUrlSecretKey }}
                path: database_url
        - name: database-roles
          configMap:
            name: {{ include "synveda.fullname" . }}-database-roles
            items:
              - key: roles.json
                path: roles.json
        - name: tmp
          emptyDir: {}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "synveda.fullname" . }}
  labels:
    {{- include "synveda.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "synveda.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synveda.serviceAccountName" . }}
  labels:
    {{- include "synveda.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
