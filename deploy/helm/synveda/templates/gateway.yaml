{{- /*
The gateway: one replica, on purpose and not as a starting point
(ADR-0062 decision 4 — the chart refuses a values file that says
otherwise, in _helpers.tpl). `Recreate` follows from the same fact: two
gateways must not overlap even for the length of a rolling update.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synveda.fullname" . }}
  labels:
    {{- include "synveda.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "synveda.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "synveda.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/database-roles: {{ include "synveda.databaseRolesJson" . | sha256sum }}
      {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "synveda.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ add (int .Values.gateway.shutdownSeconds) 10 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "synveda.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8120
          env:
            - name: DATABASE_URL_FILE
              value: /run/secrets/synveda-gateway/database_url
            - name: SYNVEDA_DATABASE_ROLES_FILE
              value: /etc/synveda/database/roles.json
            # The image's default is 127.0.0.1:8120. A pod that binds
            # loopback is a pod no Service can reach.
            - name: SYNVEDA_LISTEN_ADDR
              value: 0.0.0.0:8120
            - name: SYNVEDA_PUBLIC_URL
              value: {{ .Values.gateway.publicUrl | quote }}
            - name: SYNVEDA_INSECURE_DEVELOPMENT_HTTP
              value: {{ .Values.gateway.insecureDevelopmentHttp | quote }}
            - name: SYNVEDA_GATEWAY_SHUTDOWN_SECS
              value: {{ .Values.gateway.shutdownSeconds | quote }}
            - name: SYNVEDA_DB_MAX_CONNECTIONS
              value: {{ .Values.gateway.dbMaxConnections | quote }}
            - name: SYNVEDA_OIDC_ISSUERS_FILE
              value: /run/secrets/synveda-runtime/issuers.json
            - name: SYNVEDA_KMS_KEY_FILE
              value: /run/secrets/synveda-runtime/kms_key
            - name: SYNVEDA_KMS_KEY_REF_FILE
              value: /run/secrets/synveda-runtime/kms_key_ref
            {{- if .Values.oidc.caExistingSecret }}
            - name: SYNVEDA_OIDC_CA_CERT_FILE
              value: /run/secrets/synveda-oidc-ca/ca.crt
            {{- end }}
            {{- include "synveda.databaseTransportEnv" . | nindent 12 }}
            - name: SYNVEDA_EMBEDDER
              value: {{ .Values.embedder | quote }}
            {{- if eq .Values.embedder "tei" }}
            - name: SYNVEDA_EMBEDDER_MODEL
              value: {{ default .Values.tei.model .Values.embedderModel | quote }}
            {{- end }}
            {{- if eq .Values.embedder "tei" }}
            - name: SYNVEDA_TEI_URL
              value: {{ if .Values.tei.enabled }}http://{{ include "synveda.fullname" . }}-tei:80{{ else }}{{ .Values.tei.url }}{{ end }}
            {{- end }}
            {{- with .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.gateway.logLevel | quote }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            # The product checks database epoch, role, grants and forced RLS.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            {{- include "synveda.databaseTransportMounts" . | nindent 12 }}
            - name: runtime-secrets
              mountPath: /run/secrets/synveda-runtime
              readOnly: true
            {{- if .Values.oidc.caExistingSecret }}
            - name: oidc-ca
              mountPath: /run/secrets/synveda-oidc-ca
              readOnly: true
            {{- end }}
            - name: gateway-database
              mountPath: /run/secrets/synveda-gateway
              readOnly: true
            - name: database-roles
              mountPath: /etc/synveda/database
              readOnly: true
            - name: tmp
              mountPath: /tmp
          {{- with .Values.gateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "synveda.databaseTransportVolumes" . | nindent 8 }}
        {{- include "synveda.runtimeSecretVolume" . | nindent 8 }}
        {{- if .Values.oidc.caExistingSecret }}
        - name: oidc-ca
          secret:
            secretName: {{ .Values.oidc.caExistingSecret }}
            defaultMode: 0444
            items:
              - key: {{ .Values.oidc.caSecretKey }}
                path: ca.crt
        {{- end }}
        - name: gateway-database
          secret:
            secretName: {{ .Values.gateway.databaseExistingSecret }}
            defaultMode: 0444
            items:
              - key: {{ .Values.gateway.databaseUrlSecretKey }}
                path: database_url
        - name: database-roles
          configMap:
            name: {{ include "synveda.fullname" . }}-database-roles
            items:
              - key: roles.json
                path: roles.json
        - name: tmp
          emptyDir: {}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "synveda.fullname" . }}
  labels:
    {{- include "synveda.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "synveda.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: false
metadata:
  name: {{ include "synveda.serviceAccountName" . }}
  labels:
    {{- include "synveda.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
