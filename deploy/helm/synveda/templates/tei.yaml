{{- if .Values.tei.enabled }}
{{- /*
The optional embedder has one replica and an RWO model cache. Scaling requires
an explicitly qualified cache/storage shape; no replica setting is accepted.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synveda.fullname" . }}-tei
  labels:
    {{- include "synveda.labels" . | nindent 4 }}
    app.kubernetes.io/component: tei
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "synveda.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tei
  template:
    metadata:
      labels:
        {{- include "synveda.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tei
      {{- with .Values.tei.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "synveda.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "synveda.podSecurity" (dict "root" . "context" .Values.tei.podSecurityContext) | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tei
          image: {{ .Values.tei.image }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /data
            {{- include "synveda.outboundEnv" . | nindent 12 }}
          args:
            - --port
            - "8080"
            - --model-id
            - {{ .Values.tei.model }}
            - --max-batch-tokens
            - {{ .Values.tei.maxBatchTokens | quote }}
            - --auto-truncate
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            # /health answers once the model is loaded. A first start
            # downloads BGE-M3 (~2.3 GB) into the cache volume and a cold
            # load measures ~2m after that, so the budget is generous by
            # the same arithmetic the compose healthcheck uses.
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          volumeMounts:
            {{- include "synveda.outboundMounts" . | nindent 12 }}
            - name: cache
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          {{- with .Values.tei.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "synveda.outboundVolumes" . | nindent 8 }}
        - name: tmp
          emptyDir: {}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-tei-cache" (include "synveda.fullname" .)) .Values.tei.cache.existingClaim }}
      {{- with .Values.tei.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tei.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tei.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if not .Values.tei.cache.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "synveda.fullname" . }}-tei-cache
  labels:
    {{- include "synveda.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.tei.cache.size }}
  {{- with .Values.tei.cache.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "synveda.fullname" . }}-tei
  labels:
    {{- include "synveda.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "synveda.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: tei
{{- end }}
