# The cluster the OPS-2 install test runs in.
#
# One node. The point of this test is not scheduling — it is that the
# product image serves its gateway command, that chart ordering holds, and that
# a CloudNativePG failover is survivable; CNPG elects a new primary among
# pods on one node exactly as it does across three, and a multi-node kind
# cluster costs minutes of CI for a property this test does not assert.
#
# No extraPortMappings: clients run inside the cluster so acceptance exercises
# the chart's exact service network rather than a host ingress shortcut.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
