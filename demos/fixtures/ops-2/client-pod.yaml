# The test client: two containers, one pod, one network namespace.
#
# `client` runs the product's own CLI — `synveda login` binds a loopback
# listener and waits, exactly as it does on a laptop. `browser` plays the
# part a browser plays, and can only reach that listener because pods share
# a network namespace. Neither container invents a path to a bearer.
#
# A Pod rather than a Job: it stays up after the round trip so the demo can
# exec back in once the database's primary has been deleted. Re-acquiring a
# bearer after a failover would be testing the IdP.
apiVersion: v1
kind: Pod
metadata:
  name: synveda-install-test
  namespace: synveda-test
  labels:
    app: synveda-install-test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: work
      emptyDir: {}
    - name: home
      emptyDir: {}
    - name: scripts
      configMap:
        name: install-test-scripts
        # 0755, in the decimal Kubernetes wants for a file mode.
        defaultMode: 493
    - name: operator-secret
      secret:
        secretName: ops2-keycloak
        defaultMode: 288
        items:
          - key: keycloak_demo_admin_password
            path: keycloak_demo_admin_password
  containers:
    - name: client
      image: ghcr.io/synveda/gateway:__IMAGE_TAG__
      imagePullPolicy: Never
      command: ["/bin/sh", "/scripts/client.sh"]
      env:
        - name: SYNVEDA_GATEWAY
          value: http://synveda.synveda-test.svc.cluster.local:8120
        - name: SYNVEDA_INSECURE_DEVELOPMENT_HTTP
          value: "true"
        - name: HOME
          value: /home/tester
        - name: WORK_DIR
          value: /work
      volumeMounts:
        - { name: work, mountPath: /work }
        - { name: home, mountPath: /home/tester }
        - { name: scripts, mountPath: /scripts }
    - name: browser
      image: node:22-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
      # Pulled, unlike the product image beside it, which is kind-loaded.
      imagePullPolicy: IfNotPresent
      command: ["node", "/scripts/browser.mjs"]
      env:
        - name: IDP_URL
          value: http://keycloak.synveda-test.svc.cluster.local:8080
        - name: APP_URL
          value: http://synveda.synveda-test.svc.cluster.local:8120
        - name: OPERATOR_USERNAME
          value: synveda-demo-admin
        - name: OPERATOR_PASSWORD_FILE
          value: /run/secrets/keycloak_demo_admin_password
        - name: CREDENTIALS_FILE
          value: /home/tester/.config/synveda/credentials.json
        - name: WORK_DIR
          value: /work
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - { name: work, mountPath: /work }
        - { name: home, mountPath: /home/tester, readOnly: true }
        - { name: scripts, mountPath: /scripts }
        - { name: operator-secret, mountPath: /run/secrets, readOnly: true }
