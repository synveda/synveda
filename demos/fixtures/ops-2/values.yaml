# What the install test installs.
#
# `fullnameOverride` so the Service has a name the test client and the
# IdP's registered redirect URI can both be written against; everything
# else is the chart's own default except where a kind node's budget says
# otherwise.
fullnameOverride: synveda

image:
  # Both images are `kind load`ed, never pulled.
  pullPolicy: Never

gateway:
  # The Service, by the name every pod in the cluster resolves it by. This
  # is the redirect URI registered at the IdP and the Origin the console
  # checks — one URL, resolving the same way for the gateway and for the
  # client, which is the property this whole test turns on.
  publicUrl: http://synveda.synveda-test.svc.cluster.local:8120
  dbMaxConnections: 10
  databaseExistingSecret: synveda-gateway-db

worker:
  # The demo creates this Secret with a fresh URL-safe password before Helm
  # starts. The chart owns the role convergence, never the credential.
  databaseExistingSecret: synveda-worker-db
  dbMaxConnections: 5
  resources: {}

oidc:
  # Written by the demo *after* the install job admits the tenant: a trust
  # entry binds an issuer to a tenant id, and that id does not exist until
  # the tenant does. The gateway pod pends on the missing secret until then,
  # which is the correct shape — an uninitialised deployment that refuses
  # rather than one that invents an issuer.
  existingSecret: synveda-oidc

kms:
  # Created by the demo before Helm renders the gateway pod. It is a
  # disposable test-only key; production custody remains an operator action.
  existingSecret: synveda-kms

# Deterministic, so CI never downloads 2.3 GB of BGE-M3. That is a real
# choice about a corpus and not a shortcut around one: this deployment
# lives for the length of one job.
embedder: deterministic

extractor:
  kind: deterministic

postgres:
  # Two, not the chart's three. A failover needs exactly one replica to
  # promote, and the third instance is what a production cluster wants for
  # quorum during maintenance — not what this assertion needs.
  #
  # The first CI run proved the difference matters: `synveda-pg-3-join` sat
  # Pending and unscheduled for nine minutes on a single-node runner that
  # had just built two container images, and the readiness gate timed out
  # while the round trip it was gating had already passed. The chart still
  # defaults to 3; a test that asks a runner for a production topology is
  # measuring the runner.
  instances: 2
  storage:
    size: 1Gi
  maxConnections: 100
  # No requests: the instances plus the gateway share one kind node.
  # Reserving what a production cluster reserves would make this
  # unschedulable rather than realistic.
  resources: {}

install:
  tenant:
    slug: acme
    name: ACME Corporation
